:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#FAFAFB; --surface-3:#F0F2F6;
  --border:#E5E8EF; --border-2:#D4D9E4;
  --text:#101828; --muted:#5A6478; --faint:#8B93A5;
  /* brand — derived from the Hello Academy mark, deepened for text contrast */
  --brand:#57489F; --brand-600:#4A3C8C; --brand-700:#382C6E; --brand-50:#F1EFF9; --brand-100:#E2DDF1;
  --teal:#1390C5; --teal-50:#E8F4FB; --teal-100:#D0E8F6;
  --ok:#1D9A68; --ok-50:#E8F5EF; --warn:#B4740B; --warn-50:#FBF1E0; --err:#C9453F; --err-50:#FAEBEA; --info:#1F7FC0; --info-50:#E8F2FA;
  --amber:#D9930F; --pink:#D53E86; --pink-50:#FCEBF3;
  /* the five logo colours, used raw for categories and charts */
  --lg:#26B36F; --lb:#25AAE3; --lp:#6D58A7; --lo:#FFAF44; --lk:#F058A1;
  --r-xs:6px; --r-sm:9px; --r:13px; --r-lg:18px; --r-xl:26px;
  --sh-1:0 1px 2px rgba(16,24,40,.05);
  --sh-2:0 1px 3px rgba(16,24,40,.05), 0 12px 28px -18px rgba(16,24,40,.28);
  --sh-3:0 24px 60px -28px rgba(16,24,40,.34), 0 2px 6px rgba(16,24,40,.06);
  --ui:'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --body:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --sidebar:250px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,select,summary,[data-act]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body.modal-open{overflow:hidden}
body{
  background:var(--bg); color:var(--text); font-family:var(--body);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,h4,h5{font-family:var(--ui); margin:0; letter-spacing:-.018em; font-weight:700; color:var(--text)}
h1{font-size:26px;line-height:1.2}
h2{font-size:20px;line-height:1.25}
h3{font-size:16px;line-height:1.3}
h4{font-size:14px;line-height:1.35}
p{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
::selection{background:var(--brand-100)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:13px}
.tiny{font-size:12px}
.mono-num{font-variant-numeric:tabular-nums}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.app{min-height:100vh;min-height:100dvh;display:flex}
.sidebar{
  width:var(--sidebar); flex:0 0 var(--sidebar); background:var(--surface);
  border-right:1px solid var(--border); position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column; z-index:40;
}
.brandmark{display:flex;align-items:center;gap:10px;padding:20px 18px 14px}
.brandmark.stacked{display:block;padding:19px 18px 15px}
.logo-mark,.logo-full{display:block;background-repeat:no-repeat;background-position:left center;background-size:contain}

.logo-mark.reverse{filter:brightness(0) invert(1)}
.brandmark.stacked .sub{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-top:5px;font-weight:600}
.brandmark .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(150deg,var(--brand) 0%,var(--brand-700) 100%);display:grid;place-items:center;color:#fff;flex:0 0 32px}
.brandmark .name{font-family:var(--ui);font-weight:800;font-size:17px;letter-spacing:-.03em}
.brandmark .sub{font-size:11px;color:var(--faint);margin-top:-2px}
.nav{padding:6px 10px;overflow-y:auto;flex:1}
.nav-label{font-size:11px;color:var(--faint);padding:14px 10px 6px;font-weight:600;font-family:var(--ui)}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);color:var(--muted);font-weight:500;font-size:14px;margin-bottom:2px;transition:background .12s,color .12s}
.nav a:hover{background:var(--surface-3);color:var(--text)}
.nav a.on{background:var(--brand-50);color:var(--brand-700);font-weight:600}
.nav a.on svg{color:var(--brand)}
.nav a svg{color:var(--faint);flex:0 0 18px}
.nav a .badge{margin-left:auto}
.side-foot{border-top:1px solid var(--border);padding:12px}
.who{display:flex;align-items:center;gap:10px;padding:6px}
.who .nm{font-weight:600;font-size:13.5px;font-family:var(--ui)}
.who .rl{font-size:11.5px;color:var(--faint)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow-x:hidden}
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:12px 22px;min-height:60px;
}
.topbar h1{font-size:19px}
.topbar .crumb{font-size:12px;color:var(--faint);font-weight:500}
.spacer{flex:1}
.content{padding:22px;max-width:1220px;width:100%;margin:0 auto;flex:1}
.content.narrow{max-width:920px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--r-sm);border:1px solid var(--border-2);
  background:var(--surface);padding:8px 13px;font-weight:600;font-size:13.5px;font-family:var(--ui);cursor:pointer;
  box-shadow:var(--sh-1);transition:background .12s,border-color .12s,transform .08s;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--border-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-600)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-3);color:var(--text)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:var(--r-xs)}
.btn.lg{padding:11px 18px;font-size:15px;border-radius:var(--r)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.iconbtn{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);position:relative}
.iconbtn:hover{background:var(--surface-3);color:var(--text)}
.menubtn{display:none}
.linkish{border:0;background:none;padding:0;cursor:pointer;color:var(--brand);font-family:var(--ui);
  font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:3px}
.notice.warn{background:var(--warn-50);color:var(--warn)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-2)}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;gap:10px;padding:15px 18px 0}
.card-h h3{flex:1}
.card-b{padding:16px 18px}
.card-f{padding:12px 18px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.row{display:flex;align-items:center;gap:10px}
.rowb{display:flex;align-items:center;gap:10px;justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sec-h h2{flex:1}

/* ---------- bits ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;font-family:var(--ui);background:var(--surface-3);color:var(--muted);white-space:nowrap}
.chip svg{width:13px;height:13px}
.chip.ok{background:var(--ok-50);color:var(--ok)}
.chip.warn{background:var(--warn-50);color:var(--warn)}
.chip.err{background:var(--err-50);color:var(--err)}
.chip.info{background:var(--info-50);color:var(--info)}
.chip.brand{background:var(--brand-50);color:var(--brand-700)}
.chip.teal{background:var(--teal-50);color:var(--teal)}
.badge{min-width:19px;height:19px;padding:0 6px;border-radius:999px;background:var(--err);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;font-family:var(--ui)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 8px}
.dot.ok{background:var(--ok)}.dot.err{background:var(--err)}.dot.warn{background:var(--warn)}.dot.info{background:var(--info)}
.avatar{border-radius:50%;display:grid;place-items:center;font-family:var(--ui);font-weight:700;color:#fff;flex:none;letter-spacing:-.02em;overflow:hidden}
.divider{height:1px;background:var(--border);margin:14px 0}
.kv{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--border)}
.kv:last-child{border-bottom:0}
.kv dt{color:var(--muted);font-size:13.5px;min-width:150px}
.kv dd{margin:0;font-weight:600;font-size:13.5px;font-family:var(--ui)}
.metric{display:flex;flex-direction:column;gap:2px}
.metric .v{font-family:var(--ui);font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1.1}
.metric .l{font-size:12.5px;color:var(--muted)}
.pill-tabs{display:inline-flex;gap:3px;background:var(--surface-3);padding:3px;border-radius:999px}
.pill-tabs button{border:0;background:transparent;padding:6px 13px;border-radius:999px;font-size:13px;font-weight:600;font-family:var(--ui);color:var(--muted);cursor:pointer}
.pill-tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--sh-1)}
.seg{display:inline-flex;border:1px solid var(--border-2);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;border-right:1px solid var(--border);background:transparent;padding:6px 11px;font-size:12.5px;font-weight:600;font-family:var(--ui);color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{color:#fff;background:var(--brand)}
.seg button.on[data-tone=ok]{background:var(--ok)}
.seg button.on[data-tone=err]{background:var(--err)}
.seg button.on[data-tone=warn]{background:var(--warn)}
.seg button.on[data-tone=info]{background:var(--info)}
.seg.sm button{padding:4px 9px;font-size:12px}

input[type=text],input[type=date],input[type=time],input[type=number],input[type=password],input[type=email],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border-2);border-radius:var(--r-sm);background:var(--surface);
  font-size:14px;font-family:var(--body);transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
textarea{resize:vertical;min-height:76px}
label.fl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px;font-family:var(--ui)}
.field{margin-bottom:13px}
.checkline{display:flex;gap:9px;align-items:flex-start;font-size:13.5px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand);margin-top:2px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:var(--ui);font-weight:600;font-size:12px;color:var(--faint);padding:0 12px 9px;border-bottom:1px solid var(--border)}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:0}
.tl-item{display:grid;grid-template-columns:58px 26px 1fr;gap:0;position:relative}
.tl-time{font-family:var(--ui);font-weight:700;font-size:13px;color:var(--muted);padding-top:14px;text-align:right;padding-right:12px;font-variant-numeric:tabular-nums}
.tl-rail{position:relative;display:flex;justify-content:center}
.tl-rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--border)}
.tl-item:first-child .tl-rail::before{top:16px}
.tl-item:last-child .tl-rail::before{bottom:calc(100% - 16px)}
.tl-node{position:relative;margin-top:12px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--border);z-index:1;color:var(--muted)}
.tl-node.teal{border-color:var(--teal-100);background:var(--teal-50);color:var(--teal)}
.tl-node.brand{border-color:var(--brand-100);background:var(--brand-50);color:var(--brand)}
.tl-node.amber{border-color:#F6E4BB;background:#FDF6E7;color:var(--amber)}
.tl-body{padding:10px 0 18px 14px;min-width:0}
.tl-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh-1)}
.tl-title{font-family:var(--ui);font-weight:700;font-size:14.5px}

/* ---------- misc widgets ---------- */
.photo{border-radius:var(--r);overflow:hidden;background:var(--surface-3);position:relative;display:block;aspect-ratio:4/3}
.photo svg,.photo img,.photo video{width:100%;height:100%;display:block;object-fit:cover;background:#000}
.photo.vid video{object-fit:contain}
.photo .cap.top{top:0;bottom:auto;padding:8px 10px 16px;background:linear-gradient(to bottom,rgba(16,24,40,.6),transparent)}
.photo-x.save{right:auto;left:6px;opacity:.85}
.photo-x{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(16,24,40,.62);color:#fff;display:grid;place-items:center;padding:0}
.uploader{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;
  padding:22px 16px;border:1.5px dashed var(--border-2);border-radius:var(--r);background:var(--surface-2);
  color:var(--muted);font-family:var(--ui);font-weight:600;font-size:14px;cursor:pointer;transition:border-color .12s,background .12s}
.uploader:hover{border-color:var(--brand);background:var(--brand-50);color:var(--brand-700)}
.uploader input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.photo .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 8px;color:#fff;font-size:11.5px;font-weight:600;font-family:var(--ui);
  background:linear-gradient(to top,rgba(6,10,24,.62),rgba(6,10,24,0))}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mood-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--border-2);background:var(--surface);font-size:20px;cursor:pointer;display:grid;place-items:center;line-height:1}
.mood-btn.on{border-color:var(--brand);background:var(--brand-50);box-shadow:0 0 0 3px var(--brand-50)}
.mood-badge{width:36px;height:36px;border-radius:12px;background:var(--surface-3);display:grid;place-items:center;font-size:18px;flex:none}
.progress{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.progress > i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.progress.teal > i{background:var(--teal)}
.progress.ok > i{background:var(--ok)}
.progress.warn > i{background:var(--warn)}
.list-row{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.list-row:last-child{border-bottom:0}
.tile{display:block;border:1px solid var(--border);border-radius:var(--r);padding:13px;background:var(--surface);cursor:pointer;text-align:left;width:100%;transition:border-color .12s,box-shadow .12s}
.tile:hover{border-color:var(--border-2);box-shadow:var(--sh-2)}
.empty{text-align:center;padding:34px 20px;color:var(--muted)}
.empty .ic{width:44px;height:44px;border-radius:14px;background:var(--surface-3);display:grid;place-items:center;margin:0 auto 12px;color:var(--faint)}
.notice{display:flex;gap:10px;padding:11px 13px;border-radius:var(--r);font-size:13px;background:var(--info-50);color:#27467F;border:1px solid #D3E0F7}
.notice.privacy{background:var(--brand-50);color:var(--brand-700);border-color:var(--brand-100)}
.notice.warn{background:var(--warn-50);color:#7A4F07;border-color:#F0DFC0}
.notice svg{flex:none;margin-top:1px}

/* ---------- parent mobile ---------- */
.parent-hero{background:linear-gradient(155deg,var(--brand-700) 0%,var(--brand) 55%,#4A5CBF 100%);color:#fff;border-radius:var(--r-xl);padding:20px;position:relative;overflow:hidden}
.parent-hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.parent-hero::before{content:"";position:absolute;right:30px;bottom:-90px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.05)}
.parent-hero h2{color:#fff;font-size:19px}
.parent-hero .sub{color:rgba(255,255,255,.75);font-size:13px}
.child-switch{display:flex;gap:8px;overflow-x:auto;padding:2px 0 2px;scrollbar-width:none}
.child-switch::-webkit-scrollbar{display:none}
.child-pill{display:flex;align-items:center;gap:9px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-family:var(--ui);font-weight:600;font-size:13.5px;white-space:nowrap}
.child-pill.on{background:#fff;color:var(--brand-700);border-color:#fff}
.today-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
.today-cell{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px}
.today-cell .lab{font-size:11.5px;color:var(--faint);font-weight:600;font-family:var(--ui)}
.today-cell .val{font-family:var(--ui);font-weight:700;font-size:15px;margin-top:3px;letter-spacing:-.02em}
.bottombar{display:none}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1fr 1fr}
.login-art{background:linear-gradient(158deg,#2F2560 0%,#4A3C8C 55%,#6D58A7 100%);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art::after{content:"";position:absolute;left:-120px;bottom:-140px;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.06)}
.login-art::before{content:"";position:absolute;right:-90px;top:-60px;width:300px;height:300px;border-radius:50%;background:rgba(37,170,227,.20)}
.login-art .wordline{font-family:var(--ui);font-weight:700;font-size:11.5px;letter-spacing:.17em;text-transform:uppercase;color:rgba(255,255,255,.78);margin-top:9px}
.login-art h2{color:#fff;font-size:34px;line-height:1.15;max-width:14ch;position:relative}
.login-panel{display:flex;align-items:center;justify-content:center;padding:40px 28px;background:var(--surface)}
.login-panel .inner{width:100%;max-width:420px}
.role-card{display:flex;gap:13px;align-items:center;width:100%;text-align:left;padding:14px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);cursor:pointer;transition:border-color .12s,box-shadow .12s,background .12s}
.role-card:hover{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
.role-card .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.role-card .t{font-family:var(--ui);font-weight:700;font-size:14.5px}
.role-card .d{font-size:12.5px;color:var(--muted)}

/* ---------- toast / modal ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#101828;color:#fff;padding:11px 16px;border-radius:999px;font-size:13.5px;font-weight:600;font-family:var(--ui);box-shadow:var(--sh-3);display:flex;gap:8px;align-items:center;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal-back{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:150;display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-3);width:100%;max-width:560px;max-height:88vh;overflow:auto}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2}
.modal-h h3{flex:1}
.modal-b{padding:18px}
.modal-f{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface)}
.sheet{position:fixed;inset:auto 0 0 0;z-index:150;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--sh-3);max-height:86vh;overflow:auto}

/* ---------- responsive ---------- */
@media (max-width: 1080px){
  .g-main{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width: 860px){
  /* login becomes a branded band above the role picker */
  .login-wrap{grid-template-columns:1fr;align-content:start}
  .login-art{padding:22px 20px 20px;padding-top:calc(22px + env(safe-area-inset-top));min-height:auto;display:block}
  .login-art h2,.login-art p,.login-art .row.wrap,.login-art .small{display:none}
  .login-panel{padding:24px 16px calc(40px + env(safe-area-inset-bottom));align-items:flex-start}
  .login-panel .logo-full{display:none}
  .login-panel .rowb{justify-content:flex-end}

  .g3,.g2{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}

  /* sidebar becomes a drawer */
  .sidebar{position:fixed;left:0;top:0;height:100dvh;transform:translateX(-100%);transition:transform .2s ease;
    box-shadow:var(--sh-3);overscroll-behavior:contain;padding-top:env(safe-area-inset-top)}
  .sidebar.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:35}
  .menubtn{display:grid}
  body.role-parent .sidebar{display:none}

  .topbar{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
  .topbar h1{font-size:17px}
  .content{padding:16px 14px 96px;padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(14px + env(safe-area-inset-right))}
  h1{font-size:22px}

  /* parent bottom navigation */
  body.role-parent .bottombar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.94);
    backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .bottombar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;color:var(--faint);font-size:10.5px;font-weight:600;font-family:var(--ui);border-radius:10px;position:relative}
  .bottombar a.on{color:var(--brand)}
  body.role-parent .toasts{bottom:calc(80px + env(safe-area-inset-bottom))}

  /* touch targets */
  .nav a{padding:11px 10px;font-size:15px}
  .iconbtn{width:40px;height:40px}
  .btn{padding:10px 14px}
  .seg{flex-wrap:wrap;max-width:100%}
  .seg button{flex:1 0 auto;padding:10px 12px;font-size:13px;border-bottom:1px solid var(--border)}
  .pill-tabs{display:flex;flex-wrap:wrap;gap:4px}
  .pill-tabs button{padding:9px 14px}
  .role-card{padding:15px 14px}

  /* iOS refuses to not zoom on inputs under 16px */
  input[type=text],input[type=date],input[type=time],input[type=number],
  input[type=password],input[type=email],select,textarea{font-size:16px}

  /* modals become bottom sheets */
  .modal-back{padding:0;align-items:end;justify-items:stretch}
  .modal{max-width:none;border-radius:var(--r-xl) var(--r-xl) 0 0;max-height:92dvh;animation:sheetup .22s ease-out}
  .modal-f{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .modal-f .btn{flex:1;justify-content:center}
  @keyframes sheetup{from{transform:translateY(18px);opacity:.5}to{transform:none;opacity:1}}

  .kv{flex-direction:column;gap:2px}
  .kv dt{min-width:0}
  .list-row{flex-wrap:wrap}
  .tl-item{grid-template-columns:44px 24px 1fr}
  .tl-time{font-size:12px;padding-right:8px}
  .tl-body{padding-left:10px}
  .metric .v{font-size:22px}
  .parent-hero{padding:17px;border-radius:var(--r-lg)}
  .gallery{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px}
}
@media (max-width: 420px){
  .today-grid{grid-template-columns:1fr 1fr}
  .gallery{grid-template-columns:1fr 1fr}
  .g4{grid-template-columns:1fr 1fr}
  .content{padding-top:14px}
}
@media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important} }
.mx-wrap{overflow:auto;max-height:74vh;-webkit-overflow-scrolling:touch}
.mx{border-collapse:separate;border-spacing:0;font-size:12px;min-width:max-content}
.mx th,.mx td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:0}
.mx thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);font-family:var(--ui);font-weight:700;
  font-size:11px;color:var(--muted);padding:7px 6px;text-align:center;vertical-align:bottom}
.mx thead tr:nth-child(2) th{top:31px}
.mx th.mx-area{background:var(--brand-50);color:var(--brand-700);letter-spacing:.01em;white-space:nowrap}
.mx th.mx-sub{height:118px;padding:0 0 8px}
.mx th.mx-sub span{display:block;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;
  margin:0 auto;font-weight:600;color:var(--text);font-size:11.5px;max-height:104px;overflow:hidden}
.mx td.mx-cell{width:38px;min-width:38px;height:30px;text-align:center;vertical-align:middle;background:var(--surface)}
.mx tr.mx-alt td.mx-cell{background:var(--surface-2)}
.mx td.mx-np{background:var(--brand-50)}
.mx tr.mx-alt td.mx-np{background:var(--brand-100)}
.mx tr.mx-last td{border-bottom:2px solid var(--border-2)}
.mx td.mx-edit{cursor:pointer}
.mx td.mx-edit:hover{box-shadow:inset 0 0 0 2px var(--brand)}
.mx td.mx-edit:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--brand)}
.mx .mx-mark{font-family:var(--ui);font-weight:700;font-size:12.5px;display:inline-block;min-width:20px}
.mx .mx-mark.ok{color:var(--ok)} .mx .mx-mark.info{color:var(--info)}
.mx .mx-mark.warn{color:var(--warn)} .mx .mx-mark.err{color:var(--err)}
.mx .mx-stick{position:sticky;z-index:2;background:var(--surface)}
.mx thead .mx-stick{z-index:4}
.mx tr.mx-alt .mx-stick{background:var(--surface-2)}
.mx .mx-no{left:0;width:46px;min-width:46px;text-align:center;padding:5px 4px}
.mx .mx-name{left:46px;width:172px;min-width:172px;text-align:left;padding:6px 9px}
.mx .mx-term{left:218px;width:34px;min-width:34px;text-align:center;font-family:var(--ui);
  font-weight:700;font-size:10.5px;color:var(--muted);background:var(--surface-3)}
.mark-grid{display:grid;grid-template-columns:1fr;gap:8px}
.mark-opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);
  border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.mark-opt:hover{border-color:var(--brand);background:var(--brand-50)}
.mark-opt.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
.mark-n{font-family:var(--ui);font-weight:800;font-size:19px;min-width:26px;color:var(--brand)}

@media (max-width:860px){

/* ---------- deterministic UUID-style ids ---------- */
function uuid(seed){
  let h1=0x811c9dc5, h2=0x01000193;
  for(let i=0;i<seed.length;i++){ h1=(h1^seed.charCodeAt(i))>>>0; h1=(h1*16777619)>>>0; h2=(h2+h1*31+i)>>>0; }
  const hex=n=>('00000000'+(n>>>0).toString(16)).slice(-8);
  const s=hex(h1)+hex(h2)+hex(h1^0x9e3779b9)+hex(h2^0x85ebca6b);
  return s.slice(0,8)+'-'+s.slice(8,12)+'-4'+s.slice(13,16)+'-a'+s.slice(17,20)+'-'+s.slice(20,32);
}
const nowISO = () => new Date().toISOString();

/* ---------- dates ---------- */
const DAY = 86400000;
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function ymd(d){ const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
function atTime(d,h,m){ const x=new Date(d); x.setHours(h,m||0,0,0); return x; }
function hm(d){ const x=new Date(d); return String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0'); }
function isWeekend(d){ const w=new Date(d).getDay(); return w===0||w===6; }
function lastSchoolDays(n){
  const out=[]; let d=today();
  out.push(new Date(d)); d=addDays(d,-1);
  while(out.length<n){ if(!isWeekend(d)) out.push(new Date(d)); d=addDays(d,-1); }
  return out;
}
const MONTHS = {
  sq:['Janar','Shkurt','Mars','Prill','Maj','Qershor','Korrik','Gusht','Shtator','Tetor','Nëntor','Dhjetor'],
  en:['January','February','March','April','May','June','July','August','September','October','November','December']
};
const WEEKDAYS = {
  sq:['E diel','E hënë','E martë','E mërkurë','E enjte','E premte','E shtunë'],
  en:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']
};
const WD_SHORT = { sq:['Die','Hën','Mar','Mër','Enj','Pre','Sht'], en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'] };
function fmtDate(d,opt){
  const x=new Date(d), l=state.lang;
  if(opt==='long') return WEEKDAYS[l][x.getDay()]+', '+x.getDate()+' '+MONTHS[l][x.getMonth()]+' '+x.getFullYear();
  if(opt==='md') return x.getDate()+' '+MONTHS[l][x.getMonth()];
  return String(x.getDate()).padStart(2,'0')+'.'+String(x.getMonth()+1).padStart(2,'0')+'.'+x.getFullYear();
}
function relDay(d){
  const diff=Math.round((today()-new Date(ymd(d)+'T00:00:00'))/DAY);
  if(diff===0) return t('today');
  if(diff===1) return t('yesterday');
  if(diff===-1) return t('tomorrow');
  return fmtDate(d,'md');
}
function relTime(iso){
  const mins=Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(mins<1) return t('just_now');
  if(mins<60) return mins+' '+t('min_ago');
  if(mins<60*24) return Math.round(mins/60)+' '+t('hr_ago');
  const d=Math.round(mins/1440);
  return d+' '+t('day_ago');
}

/* ---------- misc ---------- */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = (arr,id) => arr.find(x=>x.id===id);
const sum = a => a.reduce((x,y)=>x+y,0);
const avg = a => a.length? sum(a)/a.length : 0;
const pct = (a,b) => b? Math.round(a/b*100) : 0;
function hashHue(str){ let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))%360; return h; }
function initials(name){ return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function avatar(name, size, id){
  const hue=hashHue(id||name), s=size||36;
  const pic = id && typeof AVATARS!=='undefined' ? AVATARS[id] : null;
  if(pic) return '<img class="avatar" src="'+esc(pic)+'" alt="'+esc(name||'')+'" '+
    'style="width:'+s+'px;height:'+s+'px;object-fit:cover" loading="lazy">';
  return '<div class="avatar" style="width:'+s+'px;height:'+s+'px;font-size:'+Math.round(s*0.38)+'px;'+
    'background:linear-gradient(145deg,hsl('+hue+' 42% 52%),hsl('+((hue+26)%360)+' 46% 40%))">'+esc(initials(name))+'</div>';
}

function rng(seedStr){
  let a=0; for(let i=0;i<seedStr.length;i++) a=(a*31+seedStr.charCodeAt(i))>>>0;
  return function(){ a|=0; a=a+0x6D2B79F5|0; let x=Math.imul(a^a>>>15,1|a);
    x=x+Math.imul(x^x>>>7,61|x)^x; return ((x^x>>>14)>>>0)/4294967296; };
}

/* =========================================================================
   ACCESS CONTROL
   The demo mirrors the production rule set: every read of student data goes
   through these helpers. In production the same predicates become Postgres
   row-level-security policies (see ARCHITECTURE.md).
   ========================================================================= */
function currentActorKey(){
  const s=state.session; if(!s) return null;
  if(s.role==='parent') return 'parent:'+s.parentId;
  if(s.role==='teacher') return 'teacher:'+s.teacherId;
  return 'admin:'+s.userId;
}
function myParent(){ return state.session && state.session.role==='parent' ? byId(DB.parents, state.session.parentId) : null; }
function myTeacher(){ return state.session && state.session.role==='teacher' ? byId(DB.teachers, state.session.teacherId) : null; }
function actorName(){
  const s=state.session; if(!s) return '';
  if(s.role==='parent'){ const p=myParent(); return p?p.name:''; }
  if(s.role==='teacher'){ const tt=myTeacher(); const u=byId(DB.users, tt.userId); return u?u.name:''; }
  const u=byId(DB.users, s.userId); return u?u.name:'';
}
function myChildren(){
  const p=myParent(); if(!p) return [];
  return DB.parentStudent.filter(r=>r.parentId===p.id).map(r=>byId(DB.students,r.studentId)).filter(Boolean);
}
function teacherClasses(teacherId){
  const ids=DB.teacherClass.filter(r=>r.teacherId===teacherId).map(r=>r.classId);
  return DB.classes.filter(c=>ids.includes(c.id));
}
function canAccessStudent(studentId){
  const s=state.session; if(!s) return false;
  if(s.role==='admin') return true;
  if(s.role==='parent') return DB.parentStudent.some(r=>r.parentId===s.parentId && r.studentId===studentId);
  if(s.role==='teacher'){
    const st=byId(DB.students,studentId); if(!st) return false;
    return teacherClasses(s.teacherId).some(c=>c.id===st.classId);
  }
  return false;
}
function canAccessClass(classId){
  const s=state.session; if(!s) return false;
  if(s.role==='admin') return true;
  if(s.role==='teacher') return teacherClasses(s.teacherId).some(c=>c.id===classId);
  if(s.role==='parent') return myChildren().some(c=>c.classId===classId);
  return false;
}
function getStudentGuarded(id){
  if(!canAccessStudent(id)) return null;
  return byId(DB.students,id);
}

function isEarlyClass(cls){ return !!cls && cls.stage==='early'; }
function staffWord(cls){ return isEarlyClass(cls) ? t('educator') : t('teacher'); }

  DB.teacherClass.some(r=>r.teacherId===tt.id && isEarlyClass(byId(DB.classes,r.classId)))); }

function isEarlyYears(student){ const c=classOf(student); return c && c.stage==='early'; }
/* the subjects a class actually has — the school maintains this list itself */
function subjectsForClass(classId){
  const c=byId(DB.classes,classId); if(!c || c.stage==='early') return [];
  const rows=DB.classSubjects.filter(cs=>cs.classId===classId).sort((a,b)=>a.ordinal-b.ordinal);
  if(rows.length) return rows.map(r=>byId(DB.subjects,r.subjectId)).filter(Boolean);
  const lvl=byId(DB.gradeLevels,c.gradeLevelId);
  const keys = lvl.ordinal>=6 ? ['math','alb','eng','sci','hist','geo','tech','art','pe']
             : lvl.ordinal<=3 ? ['alb','math','sci','eng','art','pe']
                              : ['math','alb','eng','sci','hist','art','pe'];
  return DB.subjects.filter(s=>keys.includes(s.key));
}

function napFor(studentId,date){ return DB.naps.find(n=>n.studentId===studentId && n.date===date); }

function gradesFor(studentId){ return DB.grades.filter(g=>g.studentId===studentId).sort((a,b)=>b.date.localeCompare(a.date)); }
function homeworkFor(student){

}
function hwStatus(hwId, studentId){

  return r? r.status : 'pending';

function attendanceStats(studentId, days){
  const from = ymd(addDays(today(), -(days||30)));
  const rows = DB.attendance.filter(a=>a.studentId===studentId && a.date>=from);
  const present = rows.filter(a=>a.status==='present'||a.status==='late').length;
  return {total:rows.length, present, absent:rows.filter(a=>a.status==='absent').length,
          late:rows.filter(a=>a.status==='late').length, excused:rows.filter(a=>a.status==='excused').length,
          rate: pct(present, rows.length)};

/* ---------- charts (hand-built SVG, no library) ---------- */
function sparkline(values, opts){
  opts=opts||{}; const w=opts.w||260, h=opts.h||64, pad=6;
  if(!values.length) return '';
  const min=Math.min.apply(null,values), max=Math.max.apply(null,values);
  const span=(max-min)||1;
  const px=i=> pad + i*((w-pad*2)/Math.max(1,values.length-1));
  const py=v=> h-pad - ((v-min)/span)*(h-pad*2);
  const pts=values.map((v,i)=>px(i)+','+py(v));
  const area='M'+px(0)+','+(h-pad)+' L'+pts.join(' L')+' L'+px(values.length-1)+','+(h-pad)+' Z';
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<defs><linearGradient id="spk" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--brand)" stop-opacity=".22"/><stop offset="100%" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#spk)"/>'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--brand)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>'+
    values.map((v,i)=>'<circle cx="'+px(i)+'" cy="'+py(v)+'" r="'+(i===values.length-1?3.4:2.2)+'" fill="var(--brand)"/>').join('')+
  '</svg>';
}
function barChart(items, opts){
  opts=opts||{}; const h=opts.h||150, max=opts.max||Math.max.apply(null,items.map(i=>i.value).concat([1]));
  return '<div style="display:flex;align-items:flex-end;gap:'+(opts.gap||10)+'px;height:'+h+'px">'+
    items.map(it=>{
      const hp=Math.max(4, Math.round(it.value/max*(h-30)));
      return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0">'+
        '<div class="tiny mono-num" style="color:var(--muted);font-weight:600">'+esc(String(it.display!==undefined?it.display:it.value))+'</div>'+
        '<div style="width:100%;height:'+hp+'px;border-radius:7px 7px 3px 3px;background:'+(it.color||'var(--brand)')+'"></div>'+
        '<div class="tiny" style="color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">'+esc(it.label)+'</div>'+
      '</div>';
    }).join('')+'</div>';
}
function donut(items, opts){
  opts=opts||{}; const size=opts.size||150, r=size/2-14, cx=size/2, cy=size/2;
  const total=sum(items.map(i=>i.value))||1; let acc=0;
  const arcs=items.map(it=>{
    const frac=it.value/total, start=acc*2*Math.PI-Math.PI/2; acc+=frac;
    const end=acc*2*Math.PI-Math.PI/2, large=frac>0.5?1:0;
    const x1=cx+r*Math.cos(start), y1=cy+r*Math.sin(start), x2=cx+r*Math.cos(end), y2=cy+r*Math.sin(end);
    if(frac>=0.999) return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+it.color+'" stroke-width="18"/>';
    return '<path d="M'+x1+','+y1+' A'+r+','+r+' 0 '+large+' 1 '+x2+','+y2+'" fill="none" stroke="'+it.color+'" stroke-width="18" stroke-linecap="butt"/>';
  }).join('');
  return '<div class="row" style="gap:18px;align-items:center;flex-wrap:wrap">'+
    '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" aria-hidden="true">'+arcs+

function go(hash){ location.hash = hash.startsWith('#')?hash:'#/'+hash; }
function parseHash(){
  const raw = location.hash.replace(/^#\/?/,'') || '';
  const [path,qs] = raw.split('?');
  const params={};
  (qs||'').split('&').filter(Boolean).forEach(kv=>{ const [k,v]=kv.split('='); params[k]=decodeURIComponent(v||''); });
  return {path, params};
}
function onRoute(){
  const {path,params}=parseHash();
  state.params=params;
  state.route = path || (state.session? state.session.role+'/'+(state.session.role==='parent'?'home':'dashboard') : 'login');
  state.sidebarOpen=false;
  render();
  window.scrollTo(0,0);
}
function routeTitle(){
  const item = (NAV[state.session.role]||[]).find(n=>n.r===state.route);
  if(item) return t(item.k);
  const map={
    'parent/report':t('daily_report'), 'teacher/class':t('class'), 'teacher/student':t('student'),
    'parent/messages':t('messages'), 'parent/setup':t('complete_profile'), 'admin/import':t('import_csv'),
    'teacher/reportcard':t('report_card'), 'admin/staff':t('teaching_staff'), 'admin/invites':t('nav_invites'), 'admin/fees':t('fee_plans'), 'admin/finance':t('nav_finance')
  };
  return map[state.route] || t('nav_dashboard');
}
function render(){
  const root=document.getElementById('root');
  document.documentElement.lang = state.lang;
  if(!state.session){ document.body.className=''; root.innerHTML=LoginView(); paintOverlay(); return; }
  document.body.className='role-'+state.session.role;
  const seg = state.route.split('/')[0];
  const view = VIEWS[state.route];
  const body = (['parent','teacher','admin'].indexOf(seg)>=0 && seg!==state.session.role)
    ? noAccessView()
    : (view ? view() : notFoundView());
  root.innerHTML =
    '<div class="app">'+
      sidebarView()+
      '<div class="main">'+topbarView()+'<div class="content'+(state.session.role==='parent'?' narrow':'')+'">'+body+'</div></div>'+
    '</div>'+
    (state.sidebarOpen?'<div class="scrim" data-act="close-sidebar"></div>':'')+

}

   THE DAY — shared timeline builder (parent view + teacher preview)
   ========================================================================= */
function dayEntries(student, date){
  const out=[];
  const att=attendanceFor(student.id,date);
  if(att && att.status!=='absent'){
    const md=moodFor(student.id,date);
    out.push({time:att.time||'08:00', tone:'brand', ic:'home',
      title: state.lang==='sq'?'Mbërriti në shkollë':'Arrived at school',
      lines: md? [t('mood')+': '+moodMeta(md.mood).emoji+' '+t(moodMeta(md.mood).label)] : [],
      chip: att.status==='late'? statusChip('late') : null});
  }
  if(att && att.status==='absent'){
    out.push({time:'—', tone:'', ic:'x', title:t('absent'),
      lines:[ att.note? L(att.note) : '' ].filter(Boolean)});
  }
  mealsFor(student.id,date).forEach(m=>{
    const cm=consumptionMeta(m.consumption);
    out.push({time:m.time||'12:00', tone:'amber', ic:'utensils', title:t(m.type),
      lines:[L(m.menu)],
      meter:{value:cm.v, label:t(cm.label)}});
  });
  activitiesFor(student.id,date).forEach(a=>{
    const p=a.participation && a.participation[student.id];
    out.push({time:a.time||'10:00', tone:'teal', ic: a.category==='outdoor'||a.category==='sport'?'sun':'palette',
      title:L(a.name), lines:[L(a.description)].filter(Boolean),
      chip: (p && PARTICIPATION.find(x=>x.key===p))? '<span class="chip teal">'+t(PARTICIPATION.find(x=>x.key===p).label)+'</span>' : null});
  });
  const nap=napFor(student.id,date);
  if(nap) out.push({time:nap.startTime, tone:'brand', ic:'moon', title:t('nap'),
    lines:[t('nap_duration')+': '+Math.floor(nap.minutes/60)+'h '+(nap.minutes%60)+'min']});
  const ph=photosFor(student.id,date);
  if(ph.length) out.push({time:'15:30', tone:'teal', ic:'camera',
    title: state.lang==='sq'? (ph.length+' foto nga dita') : (ph.length+' photos from the day'),
    photos:ph});
  out.sort((a,b)=> (a.time||'').localeCompare(b.time||''));
  return out;
}
function timelineHTML(entries){
  if(!entries.length) return '';
  return '<div class="tl">'+entries.map(e=>
    '<div class="tl-item">'+
      '<div class="tl-time">'+esc(e.time)+'</div>'+
      '<div class="tl-rail"><div class="tl-node '+(e.tone||'')+'">'+icon(e.ic,14)+'</div></div>'+
      '<div class="tl-body"><div class="tl-card">'+
        '<div class="rowb"><span class="tl-title">'+esc(e.title)+'</span>'+(e.chip||'')+'</div>'+
        (e.lines||[]).map(l=>'<div class="small muted" style="margin-top:3px">'+esc(l)+'</div>').join('')+
        (e.meter? '<div class="row" style="margin-top:9px;gap:9px"><div class="progress teal" style="flex:1"><i style="width:'+e.meter.value+'%"></i></div>'+
                  '<span class="tiny" style="font-weight:700;font-family:var(--ui)">'+esc(e.meter.label)+'</span></div>':'')+
        (e.photos? '<div class="gallery" style="margin-top:10px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">'+
          e.photos.map(p=>mediaTile(p)).join('')+'</div>':'')+
      '</div></div>'+
    '</div>').join('')+'</div>';
}

function achievementsFor(st){
  const s=attendanceStats(st.id,30), ov=overallAverage(st.id)||0;
  const out=[];
  if(s.rate>=95) out.push({ic:'star', title: state.lang==='sq'?'Prezencë e shkëlqyer':'Excellent attendance', sub:s.rate+'% '+t('this_month')});
  if(ov>=4) out.push({ic:'award', title: state.lang==='sq'?'Mesatare mbi 4.0':'Average above 4.0', sub:ov.toFixed(2)});
  out.push({ic:'heart', title: state.lang==='sq'?'Ndihmon shokët':'Helps classmates', sub: state.lang==='sq'?'Vërejtje e mësuesit':'Teacher observation'});
  return out.slice(0,3);
}
function earlyDevelopment(st){

    {k:'language', sq:'Gjuha dhe komunikimi', en:'Language and communication', v:82, ic:'message'},
    {k:'social',   sq:'Zhvillimi social',      en:'Social development',        v:90, ic:'users'},

  ];
  const acts=DB.activities.filter(a=>a.classId===st.classId).slice(0,60);
  const counts={};
  acts.forEach(a=>{ counts[a.category]=(counts[a.category]||0)+1; });
  const top=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).slice(0,5)

  return sectionHead(state.lang==='sq'?'Zhvillimi i Emmës':'Development')+

                        :'There are no marks in the early years. We follow each child\u2019s development by area, at their own pace.')+'</span></div>'+
    '<div class="card"><div class="card-b">'+areas.map(a=>
      '<div style="margin-bottom:15px"><div class="rowb" style="margin-bottom:6px">'+
        '<div class="row" style="gap:8px">'+icon(a.ic,16,'')+'<b style="font-family:var(--ui);font-size:13.5px">'+esc(state.lang==='sq'?a.sq:a.en)+'</b></div>'+
        '<span class="tiny muted">'+(a.v>=85?t('part_excellent'):(a.v>=70?t('part_good'):t('part_partial')))+'</span></div>'+
      '<div class="progress teal"><i style="width:'+a.v+'%"></i></div></div>').join('')+

function monthGrid(events){
  const base=today(), y=base.getFullYear(), m=base.getMonth();
  const first=new Date(y,m,1), startDay=(first.getDay()+6)%7;
  const daysIn=new Date(y,m+1,0).getDate();
  const evMap={}; events.forEach(e=>{ (evMap[e.date]=evMap[e.date]||[]).push(e); });
  let cells='';
  for(let i=0;i<startDay;i++) cells+='<div></div>';
  for(let dnum=1;dnum<=daysIn;dnum++){
    const date=ymd(new Date(y,m,dnum)), isToday=date===ymd(base), has=evMap[date];
    cells+='<div style="aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;'+
      (isToday?'background:var(--brand);color:#fff;':'background:'+(has?'var(--brand-50)':'transparent')+';')+'">'+
      '<span style="font-family:var(--ui);font-weight:'+(isToday?'800':'600')+';font-size:13px">'+dnum+'</span>'+
      (has?'<span style="width:5px;height:5px;border-radius:50%;background:'+(isToday?'#fff':'var(--brand)')+'"></span>':'<span style="height:5px"></span>')+
    '</div>';
  }
  return '<div class="card"><div class="card-b">'+
    '<div class="rowb" style="margin-bottom:10px"><b style="font-family:var(--ui)">'+MONTHS[state.lang][m]+' '+y+'</b></div>'+
    '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">'+
      WD_SHORT[state.lang].slice(1).concat([WD_SHORT[state.lang][0]]).map(w=>'<div class="tiny faint" style="text-align:center;padding-bottom:4px">'+w+'</div>').join('')+
      cells+
    '</div></div></div>';
}

function participantName(p){
  if(!p) return '';
  if(p.kind==='parent'){ const x=byId(DB.parents,p.id); return x?x.name:''; }
  if(p.kind==='teacher'){ return teacherName(p.id); }
  const u=byId(DB.users,p.id); return u? u.name : t('role_admin');

function senderName(key){
  const [kind,id]=key.split(':');
  return participantName({kind,id});
}

function myClasses(){ return teacherClasses(state.session.teacherId); }
function currentClass(){
  const list=myClasses(); if(!list.length) return null;
  const id=state.params.c || state.ui.classId;
  let c=id? list.find(x=>x.id===id) : null;
  if(!c) c=list[0];
  state.ui.classId=c.id;
  return c;
}
function studentsOfClass(classId){ return DB.students.filter(s=>s.classId===classId); }
function classAttendanceTaken(classId){
  const d=ymd(today());
  return DB.attendance.some(a=>a.classId===classId && a.date===d);
}
function classPublished(classId){
  const d=ymd(today());
  const st=studentsOfClass(classId);
  return st.length>0 && st.every(s=>{ const r=reportFor(s.id,d); return r && r.published; });
}
function classSubjects(cls){
  const rows=DB.teacherClass.filter(r=>r.classId===cls.id && r.teacherId===state.session.teacherId && r.subjectId);
  if(rows.length) return rows.map(r=>byId(DB.subjects,r.subjectId));
  return subjectsForClass(cls.id);
}

      label:(state.lang==='sq'?'Merr prezencën — ':'Take attendance — ')+c.name, href:'#/teacher/attendance?c='+c.id});

              '<div style="flex:1;min-width:0"><div style="font-weight:700;font-family:var(--ui);font-size:14px">'+esc(c.name)+'</div>'+
              '<div class="tiny muted">'+c.startTime+'–'+c.endTime+' · '+esc(c.room)+' · '+n+' '+t('students').toLowerCase()+'</div></div>'+

/* ---------- day sheet (the core teacher workflow) ---------- */
function TeacherDaySheet(){
  const c=currentClass(); if(!c||!canAccessClass(c.id)) return noAccessView();
  if(c.stage!=='early') return primaryDaySheet(c);
  const d=ymd(today()), st=studentsOfClass(c.id);
  const step=state.ui.step||'attendance';
  const steps=[['attendance','clipboard',t('attendance')],['meals','utensils',t('meals')],
               ['activities','palette',t('activities')],['mood','smile',t('mood')+' & '+t('nap')],
               ['notes','message',t('notes')],['photos','camera',t('photos')],['publish','send',t('publish')]];
  const done={
    attendance: st.every(s=>attendanceFor(s.id,d)),
    meals: st.some(s=>mealsFor(s.id,d).length),
    activities: DB.activities.some(a=>a.classId===c.id && a.date===d),
    mood: st.some(s=>moodFor(s.id,d)),
    notes: DB.teacherNotes.some(n=>n.classId===c.id && n.date===d),
    photos: DB.photos.some(p=>p.classId===c.id && p.date===d),
    publish: classPublished(c.id)
  };
  return classPicker(c,'teacher/daysheet')+
    '<div class="card" style="margin-top:16px"><div class="card-b">'+
      '<div class="rowb wrap" style="gap:12px"><div><h2>'+t('day_sheet')+' · '+esc(c.name)+'</h2>'+
        '<div class="small muted">'+esc(fmtDate(today(),'long'))+' · '+st.length+' '+t('students').toLowerCase()+'</div></div>'+
        (done.publish? '<span class="chip ok">'+icon('checkcircle',13)+t('published')+'</span>'
                     : '<span class="chip warn">'+icon('clock',13)+t('not_published')+'</span>')+'</div>'+
      '<div class="row wrap" style="gap:6px;margin-top:14px">'+steps.map(([k,ic,label])=>
        '<button class="btn sm '+(step===k?'primary':'')+'" data-act="daysheet-step" data-v="'+k+'">'+
          icon(done[k]?'checkcircle':ic,15)+esc(label)+'</button>').join('')+'</div>'+
    '</div></div>'+
    '<div style="margin-top:16px">'+daySheetStep(c,step,st,d)+'</div>';
}
function daySheetStep(c,step,st,d){
  if(step==='attendance'){
    return '<div class="card"><div class="card-h"><h3>'+t('attendance')+'</h3>'+
      '<button class="btn sm primary" data-act="att-all" data-c="'+c.id+'">'+icon('check',15)+t('mark_all_present')+'</button></div>'+
      '<div class="card-b">'+st.map(s=>{
        const a=attendanceFor(s.id,d), cur=a?a.status:null;
        return '<div class="list-row"><div class="row" style="gap:10px;flex:1;min-width:0">'+avatar(s.fullName,34,s.id)+
          '<span style="font-weight:600;font-family:var(--ui);font-size:13.5px">'+esc(s.firstName)+' '+esc(s.lastName)+'</span></div>'+
          '<div class="seg sm">'+Object.keys(ATT_STATUS).map(k=>
            '<button class="'+(cur===k?'on':'')+'" data-tone="'+ATT_STATUS[k].tone+'" data-act="att-set" data-st="'+s.id+'" data-v="'+k+'">'+t(ATT_STATUS[k].label)+'</button>').join('')+
          '</div></div>';
      }).join('')+'</div>'+
      '<div class="card-f" style="text-align:right"><button class="btn primary" data-act="daysheet-step" data-v="meals">'+t('next')+icon('chevron',15)+'</button></div></div>';
  }
  if(step==='meals'){
    const mt=state.ui.mealType||'lunch';
    const menuVal=(function(){ const m=DB.meals.find(x=>x.classId===c.id && x.date===d && x.type===mt); return m? L(m.menu):''; })();
    return '<div class="card"><div class="card-h"><h3>'+t('meals')+'</h3></div><div class="card-b">'+
      '<div class="seg" style="margin-bottom:14px">'+MEAL_TYPES.map(k=>
        '<button class="'+(mt===k?'on':'')+'" data-act="meal-type" data-v="'+k+'">'+t(k)+'</button>').join('')+'</div>'+
      '<div class="field"><label class="fl">'+t('menu_today')+'</label>'+
        '<input type="text" id="menuInput" value="'+esc(menuVal)+'" placeholder="'+(state.lang==='sq'?'p.sh. Mish pule, oriz, perime':'e.g. Chicken, rice, vegetables')+'" /></div>'+
      '<div class="row wrap" style="gap:8px;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:8px">'+
        '<span class="small muted" style="margin-right:4px">'+t('apply_to_class')+':</span>'+
        CONSUMPTION.map(cm=>'<button class="btn sm" data-act="meal-all" data-c="'+c.id+'" data-v="'+cm.key+'">'+t(cm.label)+'</button>').join('')+
      '</div>'+
      st.map(s=>{
        const m=DB.meals.find(x=>x.studentId===s.id && x.date===d && x.type===mt);
        const cur=m?m.consumption:null;
        const med=DB.medical.find(x=>x.studentId===s.id);
        return '<div class="list-row"><div class="row" style="gap:10px;flex:1;min-width:0">'+avatar(s.fullName,34,s.id)+
          '<div style="min-width:0"><span style="font-weight:600;font-family:var(--ui);font-size:13.5px">'+esc(s.firstName)+'</span>'+
          (med && med.allergies.length? '<span class="chip warn" style="margin-left:7px">'+icon('alert',11)+esc(med.allergies.join(', '))+'</span>':'')+'</div></div>'+
          '<div class="seg sm">'+CONSUMPTION.map(cm=>
            '<button class="'+(cur===cm.key?'on':'')+'" data-act="meal-set" data-st="'+s.id+'" data-v="'+cm.key+'">'+t(cm.label)+'</button>').join('')+'</div></div>';
      }).join('')+
      '</div><div class="card-f" style="text-align:right"><button class="btn primary" data-act="daysheet-step" data-v="activities">'+t('next')+icon('chevron',15)+'</button></div></div>';
  }
  if(step==='activities'){
    const acts=DB.activities.filter(a=>a.classId===c.id && a.date===d);
    return '<div class="card"><div class="card-h"><h3>'+t('activities')+'</h3>'+
      '<button class="btn sm primary" data-act="new-activity" data-c="'+c.id+'">'+icon('plus',15)+t('add_activity')+'</button></div>'+
      '<div class="card-b">'+(acts.length? acts.map(a=>
        '<div class="list-row"><div class="mood-badge" style="background:var(--teal-50);color:var(--teal)">'+icon('palette',17)+'</div>'+
        '<div style="flex:1;min-width:0"><div style="font-weight:700;font-family:var(--ui);font-size:13.5px">'+esc(L(a.name))+'</div>'+
        '<div class="tiny muted">'+esc(a.time)+' · '+esc(L(a.description))+'</div></div>'+
        '<span class="chip">'+a.studentIds.length+' '+t('students').toLowerCase()+'</span></div>').join('')
        : emptyState('nothing_here','bulk_hint','palette','<button class="btn primary" data-act="new-activity" data-c="'+c.id+'">'+t('add_activity')+'</button>'))+
      '</div><div class="card-f" style="text-align:right"><button class="btn primary" data-act="daysheet-step" data-v="mood">'+t('next')+icon('chevron',15)+'</button></div></div>';
  }
  if(step==='mood'){
    return '<div class="card"><div class="card-h"><h3>'+t('mood')+' & '+t('nap')+'</h3>'+
      '<button class="btn sm" data-act="nap-all" data-c="'+c.id+'">'+icon('moon',15)+(state.lang==='sq'?'Gjumë 1h20 për të gjithë':'Nap 1h20 for everyone')+'</button></div>'+
      '<div class="card-b">'+st.map(s=>{
        const md=moodFor(s.id,d), np=napFor(s.id,d);
        return '<div class="list-row wrap"><div class="row" style="gap:10px;flex:1;min-width:150px">'+avatar(s.fullName,34,s.id)+
          '<div><div style="font-weight:600;font-family:var(--ui);font-size:13.5px">'+esc(s.firstName)+'</div>'+
          '<div class="tiny muted">'+(np? t('nap')+' '+Math.floor(np.minutes/60)+'h '+(np.minutes%60)+'m' : t('no_nap'))+'</div></div></div>'+
          '<div class="row" style="gap:5px">'+MOODS.map(m=>
            '<button class="mood-btn'+(md&&md.mood===m.key?' on':'')+'" title="'+t(m.label)+'" data-act="mood-set" data-st="'+s.id+'" data-v="'+m.key+'">'+m.emoji+'</button>').join('')+'</div></div>';
      }).join('')+
      '</div><div class="card-f" style="text-align:right"><button class="btn primary" data-act="daysheet-step" data-v="notes">'+t('next')+icon('chevron',15)+'</button></div></div>';
  }
  if(step==='notes'){
    return '<div class="card"><div class="card-h"><h3>'+t('notes')+'</h3></div><div class="card-b">'+
      '<p class="small muted" style="margin-bottom:12px">'+(state.lang==='sq'
        ?'Një shënim i shkurtër personal ndryshon shumë për prindin. Nuk është i detyrueshëm për çdo fëmijë.'
        :'A short personal note means a lot to a parent. It is not required for every child.')+'</p>'+
      st.map(s=>{
        const n=notesFor(s.id,d)[0];
        return '<div class="list-row"><div class="row" style="gap:10px;flex:1;min-width:0">'+avatar(s.fullName,34,s.id)+
          '<div style="min-width:0"><div style="font-weight:600;font-family:var(--ui);font-size:13.5px">'+esc(s.firstName)+'</div>'+

          '<button class="btn sm '+(n?'':'primary')+'" data-act="note-open" data-st="'+s.id+'">'+icon('edit',14)+(n?t('edit'):t('add'))+'</button></div>';
      }).join('')+
      '</div><div class="card-f" style="text-align:right"><button class="btn primary" data-act="daysheet-step" data-v="photos">'+t('next')+icon('chevron',15)+'</button></div></div>';
  }
  if(step==='photos'){
    const ph=DB.photos.filter(p=>p.classId===c.id && p.date===d);
    const noConsent=st.filter(s=>!s.photoConsent);
    return '<div class="card"><div class="card-h"><h3>'+t('photos')+'</h3>'+
      '<button class="btn sm primary" data-act="photo-add" data-c="'+c.id+'">'+icon('camera',15)+t('add_photo')+'</button></div>'+
      '<div class="card-b">'+
        (noConsent.length? '<div class="notice warn" style="margin-bottom:12px">'+icon('shield',16)+'<span>'+
          esc(noConsent.map(s=>s.firstName).join(', '))+' — '+t('consent_missing')+'</span></div>':'')+
        (ph.length? '<div class="gallery">'+ph.map(p=>mediaTile(p)).join('')+'</div>'
          : emptyState('nothing_here','photos_private','image','<button class="btn primary" data-act="photo-add" data-c="'+c.id+'">'+t('add_photo')+'</button>'))+
      '</div><div class="card-f" style="text-align:right"><button class="btn primary" data-act="daysheet-step" data-v="publish">'+t('next')+icon('chevron',15)+'</button></div></div>';
  }
  /* publish */
  const present=st.filter(s=>{ const a=attendanceFor(s.id,d); return a && a.status!=='absent'; });

function AdminDashboard(){
  const d=ymd(today());
  const students=DB.students, classes=DB.classes;
  const todayRows=DB.attendance.filter(a=>a.date===d);
  const present=todayRows.filter(a=>a.status==='present'||a.status==='late').length;
  const absent=todayRows.filter(a=>a.status==='absent').length;
  const pendingClasses=classes.filter(c=>!DB.attendance.some(a=>a.classId===c.id && a.date===d));
  const week=lastSchoolDays(5).reverse().map(day=>{
    const rows=DB.attendance.filter(a=>a.date===ymd(day));
    const p=rows.filter(a=>a.status==='present'||a.status==='late').length;
    return {label:WD_SHORT[state.lang][new Date(day).getDay()], value:pct(p,rows.length)||0, display:(pct(p,rows.length)||0)+'%'};
  });
  const dist=DB.gradeLevels.map((l,i)=>({label:L(l.name), value:students.filter(s=>{ const c=classOf(s); return c.gradeLevelId===l.id; }).length,
    color:['var(--lp)','var(--lb)','var(--lo)','var(--lg)','var(--lk)'][i%5]}));
  const recent=[]
    .concat(DB.grades.slice(-4).map(g=>({at:g.date, ic:'cap', text:(state.lang==='sq'?'Notë e re në ':'New grade in ')+L(byId(DB.subjects,g.subjectId).name)+' — '+byId(DB.students,g.studentId).fullName})))
    .concat(DB.homework.slice(-3).map(h=>({at:h.assignedDate, ic:'file', text:(state.lang==='sq'?'Detyrë e re: ':'New homework: ')+L(h.title)})))
    .concat(DB.announcements.slice(0,2).map(a=>({at:a.publishedAt.slice(0,10), ic:'bell', text:(state.lang==='sq'?'Njoftim: ':'Announcement: ')+L(a.title)})))
    .sort((a,b)=>b.at.localeCompare(a.at)).slice(0,7);

  return '<div class="grid g4">'+
      '<div class="card"><div class="card-b">'+metric(students.length,t('total_students'))+'</div></div>'+
      '<div class="card"><div class="card-b">'+metric(DB.teachers.length,t('total_teachers'))+'</div></div>'+
      '<div class="card"><div class="card-b">'+metric(classes.length,t('total_classes'))+'</div></div>'+
      '<div class="card"><div class="card-b">'+metric(absent,t('absent_today'), absent?'err':'ok')+'</div></div>'+
    '</div>'+
    (function(){
      const pending=DB.students.filter(s=>!profileScore(s).complete);
      if(!pending.length) return '';
      return '<a class="card" href="#/admin/students" style="display:block;margin-top:16px;border-color:var(--warn-50)">'+
        '<div class="card-b"><div class="rowb" style="gap:12px;flex-wrap:wrap">'+
        '<div class="row" style="gap:12px"><span class="chip warn">'+icon('alert',13)+pending.length+'</span>'+
        '<div><div style="font-family:var(--ui);font-weight:700;font-size:14.5px">'+t('pending_profiles')+'</div>'+
        '<div class="tiny muted">'+esc(pending.slice(0,4).map(s=>s.fullName).join(', '))+(pending.length>4?' …':'')+'</div></div></div>'+
        '<span class="chip">'+(DB.students.length-pending.length)+'/'+DB.students.length+' '+t('profiles_done').toLowerCase()+'</span>'+
      '</div></div></a>';
    })()+
    '<div class="grid g-main" style="margin-top:16px">'+
      '<div class="card"><div class="card-h"><h3>'+t('weekly_attendance')+'</h3>'+
        '<span class="chip '+(pendingClasses.length?'warn':'ok')+'">'+
        (pendingClasses.length? pendingClasses.length+' '+(state.lang==='sq'?'klasë pa shënuar':'classes pending') : t('attendance_today')+' ✓')+'</span></div>'+
        '<div class="card-b">'+barChart(week,{h:170})+
        '<div class="divider"></div>'+
        '<div class="row" style="gap:28px;flex-wrap:wrap">'+metric(present,t('attendance_today'),'ok')+metric(absent,t('absent_today'),'err')+
          metric(pct(present,todayRows.length)+'%',t('attendance_rate'))+'</div>'+
      '</div></div>'+
      '<div class="card"><div class="card-h"><h3>'+t('student_distribution')+'</h3></div>'+
        '<div class="card-b">'+donut(dist,{size:150, centerLabel:t('students').toLowerCase()})+'</div></div>'+
    '</div>'+
    '<div class="grid g-main" style="margin-top:16px">'+
      '<div class="card"><div class="card-h"><h3>'+t('recent_activity')+'</h3></div><div class="card-b" style="padding-top:6px">'+
        recent.map(r=>'<div class="list-row"><div class="mood-badge" style="background:var(--surface-3);color:var(--muted)">'+icon(r.ic,16)+'</div>'+
        '<div style="flex:1;min-width:0"><div class="small" style="font-weight:500">'+esc(r.text)+'</div>'+
        '<div class="tiny faint">'+esc(relDay(r.at))+'</div></div></div>').join('')+
      '</div></div>'+
      '<div class="stack">'+
        '<div class="card"><div class="card-h"><h3>'+t('announcements')+'</h3>'+
          '<button class="btn sm primary" data-act="new-announcement">'+icon('plus',15)+t('add')+'</button></div>'+
          '<div class="card-b" style="padding-top:6px">'+DB.announcements.slice(0,3).map(a=>
            '<div class="list-row"><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13.5px;font-family:var(--ui)">'+esc(L(a.title))+'</div>'+
            '<div class="tiny muted">'+esc(relTime(a.publishedAt))+'</div></div>'+

        '</div></div>'+
        '<div class="card"><div class="card-h"><h3>'+t('upcoming_events')+'</h3></div><div class="card-b" style="padding-top:6px">'+
          DB.events.filter(e=>e.date>=ymd(today())).slice(0,4).map(eventRow).join('')+'</div></div>'+
      '</div>'+
    '</div>';
}

/* =========================================================================
   PROFILE COMPLETION  (parent fills in what the school cannot know)
   and STUDENT INTAKE  (how the school's data gets in)
   ========================================================================= */

function medOf(studentId){ return DB.medical.find(m=>m.studentId===studentId); }
function pickupsOf(studentId){ return DB.pickups.filter(p=>p.studentId===studentId); }
function contactsOf(studentId){ return DB.emergencyContacts.filter(c=>c.studentId===studentId); }

const SETUP_STEPS = ['health','doctor','contacts','pickup','consent','confirm'];
const SETUP_META = {
  health:{k:'step_health', ic:'shield'}, doctor:{k:'step_doctor', ic:'plus'},
  contacts:{k:'step_contacts', ic:'users'}, pickup:{k:'step_pickup', ic:'child'},
  consent:{k:'step_consent', ic:'camera'}, confirm:{k:'step_confirm', ic:'checkcircle'}
};

/* the five things a school chases on paper every September */
function profileSections(st){
  const med=medOf(st.id)||{}, yearStart=DB.schoolYears[0].startDate;
  const guardians=DB.parentStudent.filter(r=>r.studentId===st.id).map(r=>byId(DB.parents,r.parentId));
  return [
    {key:'health',   done: !!med.allergiesAnswered},
    {key:'doctor',   done: !!(med.doctor && med.doctorPhone)},
    {key:'contacts', done: guardians.every(g=>!!g.phone) && contactsOf(st.id).length>0},
    {key:'pickup',   done: pickupsOf(st.id).length>0},
    {key:'consent',  done: !!(st.photoConsentAt && st.photoConsentAt.slice(0,10) >= yearStart)}
  ];
}
function profileScore(st){
  const secs=profileSections(st), done=secs.filter(s=>s.done).length;
  return {secs, done, total:secs.length, pct:Math.round(done/secs.length*100), complete:done===secs.length};
}

/* ---------- the nudge that appears until it is done ---------- */
function profilePromptCard(st){
  const sc=profileScore(st);
  if(sc.complete && st.profileConfirmedAt) return '';
  const firstOpen=(sc.secs.find(s=>!s.done)||{key:'confirm'}).key;
  return '<div class="card" style="margin-top:16px;border-color:var(--brand-100);background:var(--brand-50)">'+
    '<div class="card-b"><div class="row" style="gap:14px;align-items:flex-start;flex-wrap:wrap">'+
      ring(sc.pct,{size:62,color:'var(--brand)'})+
      '<div style="flex:1;min-width:180px">'+
        '<div style="font-family:var(--ui);font-weight:700;font-size:15px">'+
          esc(tf('profile_incomplete',{n:st.firstName}))+'</div>'+
        '<p class="small" style="color:var(--brand-700);margin-top:4px">'+t('profile_incomplete_hint')+'</p>'+
        '<div class="tiny" style="color:var(--brand-700);margin-top:6px;font-weight:600">'+
          esc(tf('sections_done',{a:sc.done,b:sc.total}))+'</div>'+
      '</div>'+
      '<a class="btn primary" href="#/parent/setup?s='+st.id+'&step='+firstOpen+'">'+
        icon('chevron',16)+t('complete_profile')+'</a>'+
    '</div></div></div>';
}

/* ---------- the flow itself ---------- */
function ParentChildSetup(){
  const st=getStudentGuarded(state.params.s||state.childId);
  if(!st) return noAccessView();
  const step = SETUP_STEPS.indexOf(state.params.step)>=0 ? state.params.step : 'health';
  const sc=profileScore(st);
  const idx=SETUP_STEPS.indexOf(step);

  const tabs='<div class="pill-tabs" style="margin-bottom:16px;flex-wrap:wrap">'+
    SETUP_STEPS.map(k=>{
      const sec=sc.secs.find(x=>x.key===k);
      return '<button class="'+(k===step?'on':'')+'" data-act="setup-step" data-s="'+st.id+'" data-v="'+k+'">'+
        (sec&&sec.done? icon('check',13) : '')+t(SETUP_META[k].k)+'</button>';
    }).join('')+'</div>';

  const body = {
    health:setupHealth, doctor:setupDoctor, contacts:setupContacts,
    pickup:setupPickup, consent:setupConsent, confirm:setupConfirm
  }[step](st);

  const nav='<div class="rowb" style="margin-top:18px;gap:9px">'+
    (idx>0? '<button class="btn" data-act="setup-step" data-s="'+st.id+'" data-v="'+SETUP_STEPS[idx-1]+'">'+t('back_step')+'</button>'
          : '<a class="btn" href="#/parent/child">'+t('back')+'</a>')+
    (step==='confirm'
      ? '<button class="btn primary" data-act="setup-confirm" data-s="'+st.id+'">'+icon('checkcircle',16)+t('confirm_profile')+'</button>'
      : '<button class="btn primary" data-act="setup-step" data-s="'+st.id+'" data-v="'+SETUP_STEPS[idx+1]+'">'+t('next_step')+icon('chevron',16)+'</button>')+
  '</div>';

  return '<div class="rowb" style="margin-bottom:14px;gap:12px;flex-wrap:wrap">'+
      '<div class="row" style="gap:10px">'+avatar(st.fullName,38,st.id)+
        '<div><h1 style="font-size:20px">'+t('complete_profile')+'</h1>'+
        '<div class="tiny muted">'+esc(st.fullName)+' · '+esc(classOf(st).name)+'</div></div></div>'+
      '<div class="row" style="gap:9px">'+ring(sc.pct,{size:44,color:'var(--brand)'})+
        '<span class="small muted">'+esc(tf('sections_done',{a:sc.done,b:sc.total}))+'</span></div>'+
    '</div>'+ tabs + body + nav;
}

function chipList(items, act, emptyKey){
  if(!items.length) return '<p class="small faint">'+t(emptyKey)+'</p>';

/* schools write "5/A" where the roster says "Klasa 5/A" — match either way */
function matchClass(v){
  const n=x=>String(x||'').toLowerCase().replace(/\s+/g,' ').trim();
  const q=n(v); if(!q) return null;
  return DB.classes.find(c=>n(c.name)===q)
      || DB.classes.find(c=>n(c.name).endsWith(' '+q) || q.endsWith(' '+n(c.name)))
      || null;
}
function parseCSV(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return [];
  if(lines[0].toLowerCase().replace(/\s/g,'').startsWith('first_name')) lines.shift();
  return lines.map((line,i)=>{
    const c=line.split(',').map(x=>x.trim());
    const r={n:i+1, first:c[0]||'', last:c[1]||'', dob:c[2]||'', gender:(c[3]||'').toLowerCase(),
             cls:c[4]||'', pName:c[5]||'', pEmail:c[6]||'', pPhone:c[7]||'', rel:c[8]||''};
    r.errors=[];
    if(!r.first || !r.last || !r.pName || !r.pEmail) r.errors.push('row_error_fields');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(r.dob) || isNaN(new Date(r.dob).getTime())) r.errors.push('row_error_date');
    r.classRef=matchClass(r.cls);
    if(!r.classRef) r.errors.push('row_error_class');
    if(DB.students.some(s=>s.fullName.toLowerCase()===(r.first+' '+r.last).toLowerCase() && s.dob===r.dob)) r.errors.push('row_error_dup');
    r.parentRef=DB.parents.find(p=>p.email.toLowerCase()===r.pEmail.toLowerCase());
    r.ok=r.errors.length===0;
    return r;
  });
}

/* create student + guardian; used by the modal and by the importer */
function createStudent(o){
  const cls=byId(DB.classes,o.classId);
  const sid=uuid('stu-new-'+o.first+o.last+Date.now());
  const dob=o.dob;
  const d=new Date(dob), T0=today();
  let a=T0.getFullYear()-d.getFullYear();
  const m=T0.getMonth()-d.getMonth(); if(m<0||(m===0&&T0.getDate()<d.getDate())) a--;
  DB.students.push({id:sid, schoolId:DB.schools[0].id, yearId:DB.schoolYears[0].id, classId:cls.id,
    firstName:o.first, lastName:o.last, fullName:o.first+' '+o.last, dob, age:a, gender:o.gender||'f',
    photoConsent:false, photoConsentAt:null, profileConfirmedAt:null,
    enrolledOn:ymd(today()), created_at:nowISO(), updated_at:nowISO()});
  DB.medical.push({id:uuid('med-'+sid), studentId:sid, allergies:[], foodRestrictions:[], medications:'',
    clinic:'', allergiesAnswered:false, notes:{sq:'',en:''}, doctor:'', doctorPhone:'',
    visibility:'guardian_and_authorised_staff', updated_at:nowISO()});
  let parent=DB.parents.find(p=>p.email.toLowerCase()===(o.pEmail||'').toLowerCase());
  let isNew=false;
  if(!parent){
    isNew=true;
    const uid=uuid('user-'+o.pEmail);
    DB.users.push({id:uid, schoolId:DB.schools[0].id, name:o.pName, email:o.pEmail, role:'parent', active:true, created_at:nowISO()});
    parent={id:uuid('par-'+o.pEmail), userId:uid, schoolId:DB.schools[0].id, name:o.pName, email:o.pEmail, phone:o.pPhone||'', created_at:nowISO()};
    DB.parents.push(parent);
  }
  DB.parentStudent.push({id:uuid('ps-'+parent.id+sid), parentId:parent.id, studentId:sid,
    relation:{sq:o.rel||'Prind',en:o.rel||'Parent'}, isPrimary:true, canPickup:true, emergencyOrder:1, created_at:nowISO()});
  pushNotification('parent:'+parent.id,'profile',
    'Plotësoni profilin e '+o.first, 'Complete '+o.first+'\u2019s profile', '#/parent/home');
  audit('student.create', o.first+' '+o.last+' → '+cls.name);
  return {student:sid, parentIsNew:isNew};
}

/* images are re-encoded down to a sane size so a 12 MP phone photo does not
   sit in memory at full resolution; video is referenced, never copied */
function readImageFile(file, maxDim){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onerror=()=>reject(new Error('read'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>resolve({type:'image', src:fr.result, name:file.name});
      img.onload=()=>{
        const m=maxDim||1600;
        let w=img.naturalWidth||m, h=img.naturalHeight||m;
        if(Math.max(w,h)>m){ const k=m/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
        try{
          const c=document.createElement('canvas'); c.width=w; c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          resolve({type:'image', src:c.toDataURL('image/jpeg',0.82), name:file.name, w, h});
        }catch(e){ resolve({type:'image', src:fr.result, name:file.name}); }
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function readMediaFile(file){
  if(file.type && file.type.indexOf('video')===0){
    return Promise.resolve({type:'video', src:URL.createObjectURL(file), name:file.name});
  }
  return readImageFile(file,1600);
}
function readMediaFiles(fileList){
  return Promise.all(Array.prototype.slice.call(fileList||[],0,12).map(readMediaFile));
}

/* one renderer for every place media is shown */
function mediaTile(p){

  if(p.src && p.mediaType==='video'){

      (cap? '<span class="cap top">'+cap+'</span>':'')+save+'</div>';

  if(p.src){
    return '<div class="photo"><img src="'+esc(p.src)+'" alt="'+cap+'" loading="lazy">'+
      (cap? '<span class="cap">'+cap+'</span>':'')+save+'</div>';
  }
  return '<div class="photo">'+photoSVG(p.id,p.kind)+(cap? '<span class="cap">'+cap+'</span>':'')+save+'</div>';

/* ---------- messaging: start a new conversation ---------- */
function recipientOptions(){
  const s=state.session, out=[];
  if(s.role==='parent'){
    const seen={};
    myChildren().forEach(c=>{
      const cls=classOf(c);
      if(cls && cls.homeroomTeacherId && !seen[cls.homeroomTeacherId]){
        seen[cls.homeroomTeacherId]=1;
        out.push({kind:'teacher', id:cls.homeroomTeacherId,
          label:teacherName(cls.homeroomTeacherId)+' · '+staffWord(cls)+' — '+cls.name});
      }
      DB.teacherClass.filter(r=>r.classId===cls.id && r.role==='subject').forEach(r=>{
        if(seen[r.teacherId]) return; seen[r.teacherId]=1;
        out.push({kind:'teacher', id:r.teacherId, label:teacherName(r.teacherId)+' · '+cls.name});
      });
    });
    DB.users.filter(u=>u.role==='admin').forEach(u=>
      out.push({kind:'admin', id:u.id, label:u.name+' · '+t('administration')}));
  } else if(s.role==='teacher'){
    const kids=myClasses().flatMap(c=>studentsOfClass(c.id));
    const seen={};
    kids.forEach(k=>DB.parentStudent.filter(r=>r.studentId===k.id).forEach(r=>{
      if(seen[r.parentId]) return; seen[r.parentId]=1;
      const p=byId(DB.parents,r.parentId);
      out.push({kind:'parent', id:p.id, label:p.name+' — '+k.firstName});
    }));
  } else {
    DB.parents.forEach(p=>out.push({kind:'parent', id:p.id, label:p.name}));
  }
  return out;
}

/* ---------- end-of-term report card ---------- */
function currentTerm(){ return DB.terms.find(x=>x.current) || DB.terms[0]; }
function reportCardData(studentId, termId){
  const term=byId(DB.terms,termId)||currentTerm();
  const st=byId(DB.students,studentId), cls=classOf(st);
  const subs=subjectsForClass(cls.id);
  const rows=subs.map(sj=>{
    const gs=DB.grades.filter(g=>g.studentId===studentId && g.subjectId===sj.id &&
      g.date>=term.start && g.date<=term.end);
    const avg=gs.length? gs.reduce((a,g)=>a+g.value,0)/gs.length : null;
    return {subject:sj, count:gs.length, avg, mark: avg==null? null : Math.max(1,Math.min(5,Math.round(avg)))};
  });
  const marked=rows.filter(r=>r.mark!=null);
  const overall=marked.length? marked.reduce((a,r)=>a+r.avg,0)/marked.length : null;
  return {term, st, cls, rows, overall, att:attendanceStats(studentId,200)};
}

/* ---------- saving media to the phone ---------- */
function downloadMedia(photoId){
  const p=byId(DB.photos,photoId); if(!p) return;
  let href=p.src, name=(L(p.caption)||'photo').replace(/[^\w\u00C0-\u024F -]/g,'').trim().replace(/\s+/g,'-');
  if(!href){
    const svg=photoSVG(p.id,p.kind);
    href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
    name+='.svg';
  } else {
    name += p.mediaType==='video' ? '.mp4' : '.jpg';
  }
  const a=document.createElement('a');
  a.href=href; a.download=name; a.rel='noopener';
  document.body.appendChild(a); a.click(); a.remove();
  audit('media.download', photoId);
}

/* =========================================================================
   DITARI ELEKTRONIK — the class register
   One entry per lesson: the topic covered, who was missing, remarks, and the
   homework set. The teacher writes it during or after the lesson; the
   guardian reads the same rows, filtered to their own child.
   ========================================================================= */

function levelOf(cls){ return byId(DB.gradeLevels, cls.gradeLevelId); }
function assessmentMode(cls){ const l=levelOf(cls); return (l && l.assessment) || 'numeric'; }

/* klasat e ulëta: vlerësim me përshkrim, jo me notë */
const DESCRIPTIVE = [
  {min:4.5, sq:'Shkëlqyeshëm',  en:'Excellent',      tone:'ok'},
  {min:3.5, sq:'Shumë mirë',    en:'Very good',      tone:'ok'},
  {min:2.5, sq:'Mirë',          en:'Good',           tone:'info'},
  {min:1.5, sq:'Mjaftueshëm',   en:'Satisfactory',   tone:'warn'},
  {min:0,   sq:'Duhet përkrahje',en:'Needs support', tone:'warn'}
];
function descriptiveFor(v){ return DESCRIPTIVE.find(d=>v>=d.min) || DESCRIPTIVE[DESCRIPTIVE.length-1]; }
/* one call site decides how a mark is spoken, everywhere */
function markLabel(cls, value){
  if(value==null) return '—';
  if(assessmentMode(cls)==='descriptive'){ const d=descriptiveFor(value); return state.lang==='sq'? d.sq : d.en; }
  return String(Math.round(value*10)/10);
}
function markTone(cls, value){
  if(value==null) return '';
  if(assessmentMode(cls)==='descriptive') return descriptiveFor(value).tone;
  return value>=4? 'ok' : (value>=3? 'info':'warn');
}

/* ---------- selectors ---------- */
function lessonsFor(classId, date){
  return DB.lessons.filter(l=>l.classId===classId && l.date===date).sort((a,b)=>a.order-b.order);
}
function lessonDaysFor(classId, n){
  const set=[...new Set(DB.lessons.filter(l=>l.classId===classId).map(l=>l.date))].sort().reverse();
  return set.slice(0, n||10);
}
function lessonRemark(lesson, studentId){
  return (lesson.remarks||[]).find(r=>r.studentId===studentId) || null;
}
function registerDays(studentId, n){
  const st=byId(DB.students,studentId); if(!st) return [];
  const days=[...new Set(DB.lessons.filter(l=>l.classId===st.classId).map(l=>l.date))].sort().reverse().slice(0,n||8);
  return days.map(d=>({date:d, lessons:lessonsFor(st.classId,d)}));
}
