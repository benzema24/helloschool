Object.assign(ACTIONS, {
  'lesson-open':(d)=>{
    if(!canAccessClass(d.c)){ toast(t('no_access'),'lock'); return; }
    modalLesson(d.c, d.p, d.d);
  },
  'lesson-absent':(d,e)=>{
    const box=document.getElementById('lsAbsent');
    const cur=box.value? box.value.split(',').filter(Boolean) : [];
    const i=cur.indexOf(d.v);
    if(i>=0) cur.splice(i,1); else cur.push(d.v);
    box.value=cur.join(',');
    const btn=e && e.target && e.target.closest ? e.target.closest('button') : null;
    if(btn) btn.classList.toggle('err', i<0);
  },
  'lesson-save':(d)=>{
    if(!canAccessClass(d.c)){ toast(t('no_access'),'lock'); return; }
    const v=id=>{ const el=document.getElementById(id); return el? el.value.trim():''; };
    const topic=v('lsTopic');
    if(!topic){ toast(t('lesson_topic_required'),'alert'); return; }
    const p=DB.periods.find(x=>x.id===d.p);
    const absentIds=v('lsAbsent')? v('lsAbsent').split(',').filter(Boolean) : [];
    const remStudent=v('lsRemStudent'), remText=v('lsRemText');
    let l=DB.lessons.find(x=>x.classId===d.c && x.date===d.d && x.periodId===d.p);
    if(!l){
      l={id:uuid('ls'+Date.now()), schoolId:DB._ref.SCHOOL, classId:d.c, date:d.d, periodId:d.p,
         order:p.order, start:p.start, end:p.end, subjectId:p.subjectId, teacherId:p.teacherId,
         remarks:[], created_at:nowISO()};
      DB.lessons.push(l);
    }
    l.topic=bi(topic);
    l.note = v('lsNote')? bi(v('lsNote')) : null;
    l.homework = v('lsHw')? bi(v('lsHw')) : null;
    l.absentIds=absentIds;
    l.recordedBy=state.session.teacherId; l.recordedAt=nowISO();
    if(remStudent && remText){
      l.remarks=(l.remarks||[]).filter(r=>r.studentId!==remStudent);
      l.remarks.push({studentId:remStudent, text:bi(remText)});
      /* a remark is written about a child, so the guardian is told it exists */
      DB.parentStudent.filter(r=>r.studentId===remStudent).forEach(r=>
        pushNotification('parent:'+r.parentId,'ditari',
          'Vërejtje e re në ditar', 'A new remark in the register', '#/parent/ditari'));
    }
    audit('lesson.record', d.c+' '+d.d+' p'+p.order);
    closeModal(); toast(t('lesson_saved'),'checkcircle'); render();
  }
});


/* =========================================================================
   MATRICA E SUKSESIT — the grade matrix from the paper register
   Students down the left, the school's own subjects across the top, grouped
   by curricular area. Three rows per child: Semestri I, Semestri II, and the
   final mark. The school edits which subjects it has; nothing is hardcoded.
   ========================================================================= */

const CONDUCT_LEVELS = [
  {key:'exemplary',    sq:'Shembullore',  en:'Exemplary',    tone:'ok'},
  {key:'very_good',    sq:'Shumë e mirë', en:'Very good',    tone:'ok'},
  {key:'good',         sq:'E mirë',       en:'Good',         tone:'info'},
  {key:'satisfactory', sq:'E kënaqshme',  en:'Satisfactory', tone:'warn'}
];
function conductLabel(k){ const c=CONDUCT_LEVELS.find(x=>x.key===k); return c? (state.lang==='sq'?c.sq:c.en) : '—'; }
function conductOf(studentId, termId){
  return DB.conduct.find(c=>c.studentId===studentId && c.termId===termId) || null;
}

function termGrade(studentId, subjectId, termId){
  return DB.termGrades.find(g=>g.studentId===studentId && g.subjectId===subjectId && g.termId===termId) || null;
}
/* the final mark is the average of the two terms, and can be overridden */
function finalMark(studentId, subjectId){
  const over=DB.termGrades.find(g=>g.studentId===studentId && g.subjectId===subjectId && g.termId==='final');
  if(over) return {value:over.value, overridden:true};
  const a=termGrade(studentId,subjectId,DB.terms[0].id), b=termGrade(studentId,subjectId,DB.terms[1].id);
  if(!a || !b) return {value:null, overridden:false, pending:true};
  return {value: Math.round((a.value+b.value)/2), overridden:false};
}
function studentTermAverage(studentId, classId, termId){
  const subs=subjectsForClass(classId);
  const vals=subs.map(s=>termGrade(studentId,s.id,termId)).filter(Boolean).map(g=>g.value);
  return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}
function successLabel(avg){
  if(avg==null) return {text:'—', tone:''};
  const sq=state.lang==='sq';
  if(avg>=4.5) return {text: sq?'Shkëlqyeshëm':'Excellent',   tone:'ok'};
  if(avg>=3.5) return {text: sq?'Shumë mirë':'Very good',     tone:'ok'};
  if(avg>=2.5) return {text: sq?'Mirë':'Good',                tone:'info'};
  if(avg>=1.5) return {text: sq?'Mjaftueshëm':'Satisfactory', tone:'warn'};
  return {text: sq?'Pamjaftueshëm':'Insufficient', tone:'err'};
}

/* ---------- the grid ---------- */
const MATRIX_ROWS=[
  {key:'t1', label:'I'},
  {key:'t2', label:'II'},
  {key:'np', label:'N.P'}
];
function matrixRowTerm(key){
  return key==='t1' ? DB.terms[0].id : (key==='t2' ? DB.terms[1].id : 'final');
}

function matrixPanel(c){
  const kids=studentsOfClass(c.id);
  const rows=classSubjectRows(c.id);
  const subs=rows.map(r=>byId(DB.subjects,r.subjectId)).filter(Boolean);
  const areas=DB.areas.slice().sort((a,b)=>a.ordinal-b.ordinal)
    .map(a=>({area:a, subs:subs.filter(s=>s.areaId===a.id)}))
    .filter(g=>g.subs.length);
  const canEdit = state.session.role==='admin' || canAccessClass(c.id);
  const filled = kids.length*subs.length? Math.round(
    kids.reduce((n,k)=>n+subs.filter(s=>termGrade(k.id,s.id,DB.terms[0].id)).length,0) / (kids.length*subs.length)*100) : 0;

  const head =
    '<thead>'+
      '<tr>'+
        '<th class="mx-stick mx-no" rowspan="2">'+t('nr')+'</th>'+
        '<th class="mx-stick mx-name" rowspan="2">'+t('student_and_parent')+'</th>'+
        '<th class="mx-stick mx-term" rowspan="2"></th>'+
        areas.map(g=>'<th colspan="'+g.subs.length+'" class="mx-area">'+esc(L(g.area.name))+'</th>').join('')+
        '<th colspan="3" class="mx-area">'+t('summary')+'</th>'+
      '</tr>'+
      '<tr>'+
        areas.flatMap(g=>g.subs.map(s=>
          '<th class="mx-sub"><span>'+esc(L(s.name))+'</span></th>')).join('')+
        '<th class="mx-sub"><span>'+t('term_average')+'</span></th>'+
        '<th class="mx-sub"><span>'+t('success')+'</span></th>'+
        '<th class="mx-sub"><span>'+t('conduct')+'</span></th>'+
      '</tr>'+
    '</thead>';

  const flatSubs=areas.flatMap(g=>g.subs);
  const body='<tbody>'+kids.map((st,i)=>
    MATRIX_ROWS.map((r,ri)=>{
      const termId=matrixRowTerm(r.key);
      const isFinal=r.key==='np';
      const avg=isFinal? null : studentTermAverage(st.id,c.id,termId);
      const cond=isFinal? null : conductOf(st.id,termId);
      return '<tr class="mx-row'+(ri===2?' mx-last':'')+(i%2?' mx-alt':'')+'">'+
        (ri===0? '<td class="mx-stick mx-no" rowspan="3"><div class="mono-num">'+(i+1)+'</div>'+
                 '<div class="tiny faint mono-num">'+esc(st.registerNo||'')+'</div></td>' : '')+
        (ri===0? '<td class="mx-stick mx-name" rowspan="3">'+
                 '<div style="font-family:var(--ui);font-weight:600;font-size:13px">'+esc(registerName(st.id))+'</div>'+
                 '<div class="tiny faint">'+esc(guardianNames(st.id))+'</div></td>' : '')+
        '<td class="mx-stick mx-term">'+r.label+'</td>'+
        flatSubs.map(s=>{
          if(isFinal){
            const f=finalMark(st.id,s.id);
            return '<td class="mx-cell mx-np">'+(f.value==null?'':
              '<span class="mx-mark '+markTone(c,f.value)+'">'+esc(markLabel(c,f.value))+'</span>')+'</td>';
          }
          const g=termGrade(st.id,s.id,termId);
          return '<td class="mx-cell'+(canEdit?' mx-edit':'')+'"'+
            (canEdit? ' data-act="mx-cell" data-s="'+st.id+'" data-sub="'+s.id+'" data-t="'+termId+'" data-c="'+c.id+'" tabindex="0"':'')+'>'+
            (g? '<span class="mx-mark '+markTone(c,g.value)+'">'+esc(markLabel(c,g.value))+'</span>' : '')+'</td>';
        }).join('')+
        (isFinal
          ? '<td class="mx-cell mx-np"></td><td class="mx-cell mx-np"></td><td class="mx-cell mx-np"></td>'
          : '<td class="mx-cell mono-num">'+(avg==null?'':avg.toFixed(2))+'</td>'+
            '<td class="mx-cell"><span class="tiny">'+(avg==null?'':esc(successLabel(avg).text))+'</span></td>'+
            '<td class="mx-cell'+(canEdit?' mx-edit':'')+'"'+
              (canEdit? ' data-act="mx-conduct" data-s="'+st.id+'" data-t="'+termId+'"':'')+'>'+
              '<span class="tiny">'+esc(cond? conductLabel(cond.value) : '')+'</span></td>')+
      '</tr>';
    }).join('')
  ).join('')+'</tbody>';

  return '<div class="rowb" style="margin-bottom:12px;gap:9px;flex-wrap:wrap">'+
      '<div class="row" style="gap:9px;flex-wrap:wrap">'+
        '<span class="chip brand">'+esc(c.name)+'</span>'+
        '<span class="chip">'+kids.length+' '+t('students').toLowerCase()+'</span>'+
        '<span class="chip">'+subs.length+' '+t('subjects').toLowerCase()+'</span>'+
        '<span class="chip '+(filled>90?'ok':'warn')+'">'+filled+'% '+t('filled').toLowerCase()+'</span>'+
      '</div>'+
      '<div class="row" style="gap:8px">'+
        (canEdit? '<button class="btn" data-act="mx-fill" data-c="'+c.id+'">'+icon('edit',15)+t('fill_column')+'</button>':'')+
        (state.session.role==='admin'? '<a class="btn" href="#/admin/subjects?c='+c.id+'">'+icon('layers',15)+t('manage_subjects')+'</a>':'')+
        '<button class="btn" data-act="print-page">'+icon('download',15)+t('print')+'</button>'+
      '</div>'+
    '</div>'+
    '<p class="tiny faint" style="margin-bottom:10px">'+t('matrix_hint')+'</p>'+
    '<div class="card"><div class="mx-wrap"><table class="mx">'+head+body+'</table></div></div>';
}

/* the paper register writes the child, then the parent's name, then the surname */
function registerName(studentId){
  const st=byId(DB.students,studentId);
  const rows=DB.parentStudent.filter(r=>r.studentId===studentId);
  const primary=(rows.find(r=>r.isPrimary)||rows[0]);
  const p=primary? byId(DB.parents,primary.parentId) : null;
  const pFirst=p? p.name.split(' ')[0] : '';
  return [st.firstName, pFirst, st.lastName].filter(Boolean).join(' ');
}
function guardianNames(studentId){
  return DB.parentStudent.filter(r=>r.studentId===studentId)
    .map(r=>{ const p=byId(DB.parents,r.parentId); return p? p.name : ''; })
    .filter(Boolean).join(' · ');
}

      '<div><h1 style="font-size:20px">'+t('manage_subjects')+'</h1>'+

  'mx-set':(d)=>{

    const v=Number(d.v);
    let g=termGrade(d.s,d.sub,d.t);
    if(g) g.value=v;
    else DB.termGrades.push({id:uuid('tg'+Date.now()+d.s+d.sub), schoolId:DB._ref.SCHOOL,
      studentId:d.s, classId:d.c, subjectId:d.sub, termId:d.t, value:v,

    audit('termgrade.set', d.s+' '+d.sub+' = '+v);
    if(d.keep){ modalFillColumn(d.c); } else { closeModal(); }
    render();
  },
  'mx-clear':(d)=>{
    const i=DB.termGrades.findIndex(g=>g.studentId===d.s && g.subjectId===d.sub && g.termId===d.t);
    if(i>=0) DB.termGrades.splice(i,1);
    audit('termgrade.clear', d.s+' '+d.sub);
    closeModal(); render();
  },
  'mx-conduct':(d)=>{
    const cur=conductOf(d.s,d.t);
    const idx=CONDUCT_LEVELS.findIndex(x=>cur && x.key===cur.value);
    const next=CONDUCT_LEVELS[(idx+1) % CONDUCT_LEVELS.length];
    if(cur) cur.value=next.key;
    else DB.conduct.push({id:uuid('cd'+Date.now()+d.s), studentId:d.s, termId:d.t, value:next.key});
    render();
  },
  'mx-fill':(d)=>{ state.ui.mxSubject=null; state.ui.mxTerm=null; modalFillColumn(d.c); },
  'mx-ctx':(d)=>{
    const s=document.getElementById('mxSub'), t2=document.getElementById('mxTerm');
    state.ui.mxSubject=s? s.value : null;
    state.ui.mxTerm=t2? t2.value : null;
    modalFillColumn(d.c);
  },

  /* the school's subject list */
  'cs-toggle':(d)=>{
    const i=DB.classSubjects.findIndex(cs=>cs.classId===d.c && cs.subjectId===d.sub);
    if(i>=0){
      const used=DB.termGrades.some(g=>g.classId===d.c && g.subjectId===d.sub);
      if(used){ toast(t('subject_in_use'),'alert'); return; }
      DB.classSubjects.splice(i,1);
      audit('class_subject.remove', d.c+' '+d.sub);
    } else {
      const n=DB.classSubjects.filter(cs=>cs.classId===d.c).length;
      DB.classSubjects.push({id:uuid('cs'+Date.now()), schoolId:DB._ref.SCHOOL, classId:d.c,
        subjectId:d.sub, ordinal:n+1, teacherId:byId(DB.classes,d.c).homeroomTeacherId});
      audit('class_subject.add', d.c+' '+d.sub);
    }
    render();
  },
  'subject-new':()=>modalSubject(null),
  'subject-edit':(d)=>modalSubject(d.sub),
  'subject-save':(d)=>{
    const v=id=>{ const e=document.getElementById(id); return e? e.value.trim():''; };
    const sq=v('sjSq'), en=v('sjEn')||sq, areaId=v('sjArea');
    if(!sq){ toast(t('row_error_fields'),'alert'); return; }
    if(d.sub){
      const s=byId(DB.subjects,d.sub);
      s.name={sq,en}; s.areaId=areaId;
      audit('subject.edit', sq);
    } else {
      DB.subjects.push({id:uuid('subj'+Date.now()), schoolId:DB._ref.SCHOOL,
        key:sq.toLowerCase().replace(/\s+/g,'_').slice(0,16), name:{sq,en}, icon:'book',
        areaId, ordinal:DB.subjects.length+1, active:true, created_at:nowISO()});
      audit('subject.create', sq);
    }
    closeModal(); toast(t('saved'),'checkcircle'); render();
  }
});

function staffAssignments(teacherId){

function staffIsActive(tt){ const u=byId(DB.users,tt.userId); return !u || u.active!==false; }

Object.assign(VIEWS, {'admin/teachers':AdminStaff, 'admin/staff':AdminStaffDetail});

Object.assign(ACTIONS, {
  'staff-new':()=>modalStaff(null),
  'staff-edit':(d)=>modalStaff(d.s),
  'sf-subject':(d,e)=>{
    const box=document.getElementById('sfSubjects');
    const cur=box.value? box.value.split(',').filter(Boolean) : [];
    const i=cur.indexOf(d.v);
    if(i>=0) cur.splice(i,1); else cur.push(d.v);
    box.value=cur.join(',');
    const btn=e && e.target && e.target.closest ? e.target.closest('button') : null;
    if(btn) btn.classList.toggle('brand', i<0);
  },
  'staff-save':(d)=>{
    if(state.session.role!=='admin'){ toast(t('no_access'),'lock'); return; }
    const v=id=>{ const el=document.getElementById(id); return el? el.value.trim():''; };
    const name=v('sfName'), email=v('sfEmail'), phone=v('sfPhone'), kind=v('sfKind');
    const subjects=v('sfSubjects')? v('sfSubjects').split(',').filter(Boolean) : [];
    if(!name || !email){ toast(t('row_error_fields'),'alert'); return; }
    const meta=STAFF_KINDS.find(k=>k.key===kind) || STAFF_KINDS[0];
    const title={sq:meta.sq, en:meta.en};
    if(d.s){
      const tt=byId(DB.teachers,d.s), u=byId(DB.users,tt.userId);
      u.name=name; u.email=email;
      tt.title=title; tt.stage=meta.stage; tt.phone=phone; tt.subjects=subjects;
      audit('staff.edit', name);
    } else {
      if(DB.users.some(x=>x.email.toLowerCase()===email.toLowerCase())){ toast(t('email_taken'),'alert'); return; }
      const uid=uuid('user-staff-'+email);
      DB.users.push({id:uid, schoolId:DB._ref.SCHOOL, name, email, role:'teacher', active:true, created_at:nowISO()});
      const tid=uuid('t-'+email);
      DB.teachers.push({id:tid, userId:uid, schoolId:DB._ref.SCHOOL, title, stage:meta.stage,
        subjects, phone, created_at:nowISO()});
      audit('staff.create', name+' ('+kind+')');
      closeModal(); toast(t('staff_added'),'checkcircle');
      go('admin/staff?s='+tid); onRoute();
      return;
    }
    closeModal(); toast(t('saved'),'checkcircle'); render();
  },
  'staff-toggle':(d)=>{
    if(state.session.role!=='admin') return;
    const tt=byId(DB.teachers,d.s), u=byId(DB.users,tt.userId);
    u.active = u.active===false;
    audit('staff.'+(u.active?'activate':'deactivate'), u.name);
    toast(u.active? t('activated') : t('deactivated'));
    render();
  },

  'assign-new':(d)=>{ state.ui.asgClass=null; modalAssign(d.s); },
  'asg-ctx':(d)=>{
    const sel=document.getElementById('asgClass');
    state.ui.asgClass = sel? sel.value : null;
    modalAssign(d.s);
  },
  'assign-save':(d)=>{
    if(state.session.role!=='admin'){ toast(t('no_access'),'lock'); return; }
    const v=id=>{ const el=document.getElementById(id); return el? el.value:''; };
    const classId=v('asgClass'), role=v('asgRole')||'subject', subjectId=v('asgSubject')||null;
    const cls=byId(DB.classes,classId);
    if(!cls){ toast(t('row_error_fields'),'alert'); return; }
    const dup=DB.teacherClass.some(r=>r.teacherId===d.s && r.classId===classId &&
      (r.subjectId||null)===(subjectId||null) && r.role===role);
    if(dup){ toast(t('already_assigned'),'alert'); return; }
    DB.teacherClass.push({id:uuid('tc'+Date.now()), teacherId:d.s, classId, role,
      subjectId: cls.stage==='early' ? null : subjectId});
    /* the register only ever names one person as homeroom staff */
    if(role==='homeroom'){
      const prev=cls.homeroomTeacherId;
      cls.homeroomTeacherId=d.s;
      if(prev && prev!==d.s){
        const i=DB.teacherClass.findIndex(r=>r.teacherId===prev && r.classId===classId && r.role==='homeroom');
        if(i>=0) DB.teacherClass[i].role='subject';
      }
    }
    audit('staff.assign', d.s+' → '+cls.name+' ('+role+')');
    closeModal(); toast(t('saved'),'checkcircle'); render();
  },
  'assign-del':(d)=>{
    if(state.session.role!=='admin') return;
    const i=DB.teacherClass.findIndex(r=>r.id===d.v);
    if(i<0) return;
    const r=DB.teacherClass[i], cls=byId(DB.classes,r.classId);
    if(r.role==='homeroom' && cls.homeroomTeacherId===r.teacherId){
      const other=DB.teacherClass.find(x=>x.classId===cls.id && x.teacherId!==r.teacherId);
      if(!other){ toast(t('class_needs_staff'),'alert'); return; }
      cls.homeroomTeacherId=other.teacherId; other.role='homeroom';
    }
    DB.teacherClass.splice(i,1);
    audit('staff.unassign', r.teacherId+' × '+cls.name);
    render();
  }
});


/* =========================================================================
   HYRJA — how people actually get in
   Guardians sign in with a one-time code, because they use one phone and
   nothing to forget. Staff use a password, because they share tablets in the
   classroom. Nobody self-registers: the school issues the invitation.
   ========================================================================= */

const CODE_TTL_MIN = 10;          /* a sign-in code is short-lived */
const INVITE_TTL_DAYS = 7;        /* an invitation letter lasts a week */

function sixDigits(seed){
  let h=0; const s=String(seed)+'|'+Math.floor(Date.now()/60000);
  for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))>>>0; }
  return String(100000 + (h % 900000));
}
function inviteCode(seed){
  const AB='ABCDEFGHJKMNPQRSTUVWXYZ23456789';   /* no O/0, no I/1 */
  let h=0; const s=String(seed);
  for(let i=0;i<s.length;i++){ h=(h*33 + s.charCodeAt(i))>>>0; }
  let out=''; for(let i=0;i<6;i++){ out+=AB[h%AB.length]; h=Math.floor(h/AB.length)+7919*(i+1); }
  return out.slice(0,3)+'-'+out.slice(3);
}
function normalisePhone(v){ return String(v||'').replace(/[^\d]/g,'').slice(-8); }

/* who is this identifier?  Each app only resolves the accounts it is for, so a
   guardian address entered in the staff app is simply not found, and the wrong
   door does not tell you that the right one exists. */
function findAccount(identifier){
  const v=String(identifier||'').trim().toLowerCase();
  if(!v) return null;
  const digits=normalisePhone(v);
  if(APP_VARIANT==='parent'){
    const g=DB.parents.find(p=>p.email.toLowerCase()===v ||
      (digits.length>=6 && normalisePhone(p.phone)===digits));
    return g? {kind:'guardian', id:g.id, name:g.name, email:g.email, phone:g.phone} : null;
  }
  const u=DB.users.find(x=>x.email.toLowerCase()===v);
  if(u && u.active!==false){
    if(u.role==='admin') return {kind:'admin', id:u.id, name:u.name, email:u.email};
    const tt=DB.teachers.find(x=>x.userId===u.id);
    if(tt) return {kind:'staff', id:tt.id, name:u.name, email:u.email};
  }
  return null;
}

/* ---------- invitations issued by the school ---------- */
function inviteFor(guardianId){
  return DB.invites.find(i=>i.guardianId===guardianId) || null;
}
function inviteState(guardianId){
  const g=byId(DB.parents,guardianId);
  if(g && g.joinedAt) return 'joined';
  const inv=inviteFor(guardianId);
  if(!inv) return 'none';
  return inv.expiresAt < nowISO() ? 'expired' : 'sent';
}
function issueInvite(guardianId){
  const g=byId(DB.parents,guardianId);
  let inv=inviteFor(guardianId);
  const exp=new Date(Date.now()+INVITE_TTL_DAYS*86400000).toISOString();
  if(inv){ inv.code=inviteCode(guardianId+Date.now()); inv.expiresAt=exp; inv.sentAt=nowISO(); }
  else {
    inv={id:uuid('inv-'+guardianId), schoolId:DB._ref.SCHOOL, guardianId, email:g.email, phone:g.phone,
      code:inviteCode(guardianId), sentAt:nowISO(), expiresAt:exp, usedAt:null,
      createdBy:state.session? state.session.userId : null};
    DB.invites.push(inv);
  }
  audit('invite.issue', g.name);
  return inv;
}

/* ---------- the school's invitation list ---------- */
function AdminInvites(){
  const guardians=DB.parents.slice().sort((a,b)=>a.name.localeCompare(b.name));
  const counts={joined:0, sent:0, expired:0, none:0};
  guardians.forEach(g=>counts[inviteState(g.id)]++);
  const rows=guardians.map(g=>{
    const st=inviteState(g.id), inv=inviteFor(g.id);
    const kids=DB.parentStudent.filter(r=>r.parentId===g.id)
      .map(r=>byId(DB.students,r.studentId)).filter(Boolean);
    const chip={joined:['ok','joined'], sent:['info','invited'], expired:['warn','expired'], none:['','not_invited']}[st];
    return '<tr><td><div class="row" style="gap:9px">'+avatar(g.name,30,g.id)+
        '<div><b style="font-family:var(--ui)">'+esc(g.name)+'</b>'+
        '<div class="tiny muted">'+esc(kids.map(k=>k.firstName+' · '+classOf(k).name).join(', '))+'</div></div></div></td>'+
      '<td class="muted small">'+esc(g.email)+'<div class="tiny faint">'+esc(g.phone||'')+'</div></td>'+
      '<td><span class="chip '+chip[0]+'">'+t(chip[1])+'</span></td>'+
      '<td class="mono-num">'+(inv && st!=='joined' ? esc(inv.code) : '')+
        (inv && st==='sent'? '<div class="tiny faint">'+t('expires')+' '+esc(fmtDate(inv.expiresAt.slice(0,10)))+'</div>':'')+'</td>'+
      '<td>'+(st==='joined' ? '<span class="tiny faint">'+esc(relDay(g.joinedAt.slice(0,10)))+'</span>'
        : '<button class="btn sm" data-act="invite-issue" data-v="'+g.id+'">'+icon('send',14)+
          t(st==='none'?'invite':'reissue')+'</button>')+'</td></tr>';
  });
  return '<div class="grid g4" style="margin-bottom:16px">'+
      '<div class="card"><div class="card-b">'+metric(counts.joined,t('joined'),'ok')+'</div></div>'+
      '<div class="card"><div class="card-b">'+metric(counts.sent,t('invited'),'info')+'</div></div>'+
      '<div class="card"><div class="card-b">'+metric(counts.expired,t('expired'),counts.expired?'warn':'')+'</div></div>'+
      '<div class="card"><div class="card-b">'+metric(counts.none,t('not_invited'),counts.none?'warn':'')+'</div></div>'+
    '</div>'+
    '<div class="notice" style="margin-bottom:14px">'+icon('info',16)+'<span>'+t('invites_hint')+'</span></div>'+
    adminTable([t('parent_name'),t('contact'),t('status'),t('code'),''], rows,
      '<div class="row" style="gap:8px">'+
        '<button class="btn" data-act="invite-print">'+icon('download',16)+t('print_letters')+'</button>'+
        '<button class="btn primary" data-act="invite-all">'+icon('send',16)+t('invite_all')+'</button></div>',
      guardians.length+' '+t('nav_parents').toLowerCase());
}

/* one printable slip per guardian, for the September parents' meeting */
function invitePrintSheet(){
  const pend=DB.parents.filter(g=>inviteState(g.id)!=='joined');
  if(!pend.length){ toast(t('nothing_to_print'),'info'); return; }
  const url=location.origin+location.pathname;
  const html=pend.map(g=>{
    const inv=inviteFor(g.id) || issueInvite(g.id);
    const kids=DB.parentStudent.filter(r=>r.parentId===g.id)
      .map(r=>byId(DB.students,r.studentId)).filter(Boolean);
    return '<div class="slip">'+
      '<div class="slip-h">'+esc(DB.schools[0].name)+'</div>'+
      '<div class="slip-n">'+esc(g.name)+'</div>'+
      '<div class="slip-k">'+esc(kids.map(k=>k.fullName+' — '+classOf(k).name).join(' · '))+'</div>'+
      '<div class="slip-u">'+esc(url)+'</div>'+
      '<div class="slip-c">'+esc(inv.code)+'</div>'+
      '<div class="slip-f">'+esc(t('slip_hint'))+'</div>'+
    '</div>';
  }).join('');
  const w=window.open('','_blank');
  if(!w){ toast(t('popup_blocked'),'alert'); return; }
  w.document.write('<!doctype html><meta charset="utf-8"><title>'+esc(t('print_letters'))+'</title>'+
    '<style>body{font-family:system-ui,sans-serif;margin:0;padding:14px;background:#fff;color:#111}'+
    '.slip{border:1px dashed #999;border-radius:10px;padding:16px 18px;margin:0 0 12px;page-break-inside:avoid}'+
    '.slip-h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#666}'+
    '.slip-n{font-size:19px;font-weight:700;margin-top:6px}'+
    '.slip-k{font-size:13px;color:#444;margin-top:2px}'+
    '.slip-u{font-size:13px;margin-top:12px;color:#333}'+
    '.slip-c{font-size:30px;font-weight:800;letter-spacing:.18em;margin-top:6px}'+
    '.slip-f{font-size:11px;color:#666;margin-top:10px;max-width:62ch}'+
    '@media print{.slip{border-style:solid;border-color:#ccc}}</style>'+html);
  w.document.close();
  audit('invite.print', pend.length+' slips');
  setTimeout(()=>{ try{ w.print(); }catch(e){} }, 250);
}

/* =========================================================================
   WIRING
   ========================================================================= */
Object.assign(VIEWS, {'admin/invites':AdminInvites});

Object.assign(ACTIONS, {
  'auth-start':()=>{
    const el=document.getElementById('authId');
    const v=el? el.value.trim() : '';
    const acc=findAccount(v);
    if(!acc){
      state.ui.auth={step:'id', error:t('account_not_found')};
      render(); return;
    }
    if(acc.kind==='guardian'){
      const code=sixDigits(acc.id);
      const isEmail=v.indexOf('@')>=0;
      state.ui.auth={step:'code', code, target:'parent:'+acc.id, name:acc.name,
        sentTo: isEmail? acc.email : (acc.phone||acc.email),
        expiresAt: new Date(Date.now()+CODE_TTL_MIN*60000).toISOString()};
      audit('auth.code_sent', acc.email);
    } else {
      state.ui.auth={step:'password', name:acc.name,
        target:(acc.kind==='admin'?'admin:':'teacher:')+acc.id};
    }
    render();
  },
  'auth-back':()=>{ state.ui.auth={step:'id'}; render(); },
  'auth-verify':()=>{
    const a=state.ui.auth||{};
    const el=document.getElementById('authCode');
    const v=el? el.value.trim() : '';
    if(a.expiresAt && a.expiresAt < nowISO()){
      state.ui.auth={step:'id', error:t('code_expired')}; render(); return;
    }
    if(v!==a.code){
      state.ui.auth=Object.assign({},a,{error:t('code_wrong')});
      toast(t('code_wrong'),'alert'); render(); return;
    }
    const g=byId(DB.parents, a.target.split(':')[1]);
    if(g && !g.joinedAt){ g.joinedAt=nowISO(); const inv=inviteFor(g.id); if(inv) inv.usedAt=nowISO(); }
    audit('auth.signin','otp');
    ACTIONS['login-as']({v:a.target});
  },
  'auth-password':()=>{
    const a=state.ui.auth||{};
    const el=document.getElementById('authPass');
    const v=el? el.value : '';
    if(!v){ toast(t('enter_password'),'alert'); return; }
    audit('auth.signin','password');
    ACTIONS['login-as']({v:a.target});
  },

  'invite-issue':(d)=>{
    if(state.session.role!=='admin'){ toast(t('no_access'),'lock'); return; }
    const inv=issueInvite(d.v);
    toast(t('invite_sent')+' · '+inv.code,'send');
    render();
  },
  'invite-all':()=>{
    if(state.session.role!=='admin'){ toast(t('no_access'),'lock'); return; }
    const pend=DB.parents.filter(g=>inviteState(g.id)!=='joined' && inviteState(g.id)!=='sent');
    pend.forEach(g=>issueInvite(g.id));
    toast(tf('invited_n',{n:pend.length}),'send');
    render();
  },
  'invite-print':()=>{
    if(state.session.role!=='admin'){ toast(t('no_access'),'lock'); return; }
    invitePrintSheet();
  }
});


/* =========================================================================
   PAGESAT — tuition, extras, invoices and receipts
   The administration issues the month, records what comes in, and can see who
   is behind. A guardian sees only their own children's invoices, and only what
   they owe — never anyone else's balance.
   ========================================================================= */

const PAY_METHODS=[
  {key:'bank', sq:'Bankë',   en:'Bank transfer'},
  {key:'cash', sq:'Kesh',    en:'Cash'},
  {key:'card', sq:'Kartelë', en:'Card'}
];
function methodLabel(k){ const m=PAY_METHODS.find(x=>x.key===k); return m? (state.lang==='sq'?m.sq:m.en) : k; }
function money(v){ return (Math.round(v*100)/100).toFixed(0)+' €'; }
function periodLabel(p){
  const [y,m]=p.split('-'); return MONTHS[state.lang][Number(m)-1]+' '+y;
}
function planOf(id){ return DB.feePlans.find(p=>p.id===id) || null; }

/* the tuition line a child falls under, used when they have no history yet —
   a child enrolled in November still has to be billed in November */
function defaultPlanFor(student){
  const cls=classOf(student), lvl=byId(DB.gradeLevels, cls.gradeLevelId);
  const byKey=k=>DB.feePlans.find(p=>p.active!==false && p.gradeLevelKey===k);
  if(lvl.ordinal===0) return byKey('kg') || DB.feePlans[0];
  return (lvl.ordinal<=5 ? byKey('g1') : byKey('g8')) || byKey('kg') || DB.feePlans[0];
}

/* an invoice is overdue once its due date has passed and nothing has arrived */
function invoiceStatus(inv){
  if(inv.status==='paid') return 'paid';
  const paid=paidOn(inv.id);
  if(paid>=inv.amount) return 'paid';
  if(paid>0) return 'part';
  return inv.dueDate < ymd(today()) ? 'overdue' : 'open';
}
function paidOn(invoiceId){
  return DB.payments.filter(p=>p.invoiceId===invoiceId).reduce((a,p)=>a+p.amount,0);
}
const PAY_TONE={paid:'ok', part:'info', open:'', overdue:'err'};

function invoicesForStudent(studentId){
  return DB.invoices.filter(i=>i.studentId===studentId)
    .sort((a,b)=>b.period.localeCompare(a.period) || a.dueDate.localeCompare(b.dueDate));
}
function balanceForStudent(studentId){
  return invoicesForStudent(studentId)
    .reduce((a,i)=>a + Math.max(0, i.amount - paidOn(i.id)), 0);
}
function financeTotals(period){
  const list=DB.invoices.filter(i=>!period || i.period===period);
  const billed=list.reduce((a,i)=>a+i.amount,0);
  const collected=list.reduce((a,i)=>a+Math.min(i.amount, paidOn(i.id)),0);
  const overdue=list.filter(i=>invoiceStatus(i)==='overdue')
    .reduce((a,i)=>a+(i.amount-paidOn(i.id)),0);
  return {billed, collected, outstanding:billed-collected, overdue,
    rate: billed? Math.round(collected/billed*100) : 0, count:list.length};
}
function billingPeriods(){
  return [...new Set(DB.invoices.map(i=>i.period))].sort().reverse();
}

/* ---------- administration ---------- */
function AdminFinance(){
  const periods=billingPeriods();
  const period=periods.indexOf(state.params.p)>=0 ? state.params.p : periods[0];
  const tot=financeTotals(period);
  const filter=state.ui.finFilter||'all';
  let list=DB.invoices.filter(i=>i.period===period);
  if(filter!=='all') list=list.filter(i=>invoiceStatus(i)===filter);
  list=list.sort((a,b)=>{
    const sa=byId(DB.students,a.studentId), sb=byId(DB.students,b.studentId);
    return sa.fullName.localeCompare(sb.fullName) || a.dueDate.localeCompare(b.dueDate);
  });
  const counts={};
  ['open','part','overdue','paid'].forEach(k=>
    counts[k]=DB.invoices.filter(i=>i.period===period && invoiceStatus(i)===k).length);

  const tabs='<div class="pill-tabs" style="margin-bottom:14px">'+periods.slice(0,6).map(p=>
    '<a class="'+(p===period?'on':'')+'" href="#/admin/finance?p='+p+'" style="padding:9px 14px;border-radius:999px;'+
    'font-family:var(--ui);font-weight:600;font-size:13px;text-decoration:none;'+
    (p===period?'background:var(--surface);box-shadow:var(--sh-1);color:var(--text)':'color:var(--muted)')+'">'+
    esc(periodLabel(p))+'</a>').join('')+'</div>';

  const filters='<div class="row wrap" style="gap:7px;margin-bottom:12px">'+
    [['all','all_invoices',null],['overdue','overdue',counts.overdue],['open','unpaid',counts.open],
     ['part','partly_paid',counts.part],['paid','paid',counts.paid]].map(([k,lbl,n])=>
      '<button class="chip '+(filter===k?'brand':'')+'" data-act="fin-filter" data-v="'+k+'" '+
      'style="cursor:pointer;border:1px solid var(--border)">'+t(lbl)+(n!=null? ' · '+n : '')+'</button>').join('')+'</div>';

  const rows=list.map(inv=>{
    const st=byId(DB.students,inv.studentId), pl=planOf(inv.planId);
    const s=invoiceStatus(inv), paid=paidOn(inv.id);
    return '<tr><td><div class="row" style="gap:9px">'+avatar(st.fullName,28,st.id)+
        '<div><b style="font-family:var(--ui)">'+esc(st.fullName)+'</b>'+
        '<div class="tiny muted">'+esc(classOf(st).name)+'</div></div></div></td>'+
      '<td class="muted">'+esc(pl? L(pl.name) : '—')+
        (inv.discount? '<div class="tiny" style="color:var(--ok)">−'+money(inv.discount)+' '+t('sibling_discount')+'</div>':'')+'</td>'+
      '<td class="mono-num">'+esc(fmtDate(inv.dueDate))+'</td>'+
      '<td class="mono-num"><b>'+money(inv.amount)+'</b>'+
        (paid && paid<inv.amount? '<div class="tiny muted">'+t('paid')+' '+money(paid)+'</div>':'')+'</td>'+
      '<td><span class="chip '+PAY_TONE[s]+'">'+t(s==='part'?'partly_paid':(s==='open'?'unpaid':s))+'</span></td>'+
      '<td>'+(s==='paid' ? '<span class="tiny faint">'+esc(lastPaymentLabel(inv.id))+'</span>'
        : '<button class="btn sm primary" data-act="pay-open" data-v="'+inv.id+'">'+icon('check',14)+t('record_payment')+'</button>')+
      '</td></tr>';
  });

  return tabs+
    '<div class="grid g4" style="margin-bottom:16px">'+
      '<div class="card"><div class="card-b">'+metric(money(tot.billed), t('billed'))+'</div></div>'+
      '<div class="card"><div class="card-b"><div class="rowb">'+metric(money(tot.collected), t('collected'),'ok')+
        ring(tot.rate,{size:60,color:'var(--ok)'})+'</div></div></div>'+
      '<div class="card"><div class="card-b">'+metric(money(tot.outstanding), t('outstanding'), tot.outstanding?'warn':'')+'</div></div>'+
      '<div class="card"><div class="card-b">'+metric(money(tot.overdue), t('overdue'), tot.overdue?'err':'')+'</div></div>'+
    '</div>'+
    '<div class="rowb" style="margin-bottom:12px;gap:9px;flex-wrap:wrap">'+filters+
      '<div class="row" style="gap:8px">'+
        '<a class="btn" href="#/admin/fees">'+icon('layers',15)+t('fee_plans')+'</a>'+
        '<button class="btn" data-act="fin-remind" data-v="'+period+'">'+icon('bell',15)+t('send_reminders')+'</button>'+
        '<button class="btn primary" data-act="fin-generate">'+icon('plus',15)+t('generate_month')+'</button>'+
      '</div></div>'+
    (rows.length? '<div class="card"><div class="table-wrap"><table><thead><tr>'+
        [t('student'),t('fee'),t('due'),t('amount'),t('status'),''].map(c=>'<th>'+esc(c)+'</th>').join('')+
      '</tr></thead><tbody>'+rows.join('')+'</tbody></table></div></div>'
      : '<div class="card"><div class="card-b">'+emptyState('nothing_here','nothing_here_hint','chart')+'</div></div>');
}
function lastPaymentLabel(invoiceId){
  const p=DB.payments.filter(x=>x.invoiceId===invoiceId).sort((a,b)=>b.date.localeCompare(a.date))[0];
  return p? fmtDate(p.date)+' · '+methodLabel(p.method) : '';
}

  const rows=DB.feePlans.map(p=>{
    const n=DB.invoices.filter(i=>i.planId===p.id).length;
    const gross=DB.invoices.filter(i=>i.planId===p.id).reduce((a,i)=>a+i.amount,0);
    return '<tr><td><b style="font-family:var(--ui)">'+esc(L(p.name))+'</b></td>'+
      '<td class="mono-num"><b>'+money(p.amount)+'</b></td>'+
      '<td class="muted">'+t(p.period==='monthly'?'monthly':'yearly')+'</td>'+
      '<td class="mono-num muted">'+n+'</td><td class="mono-num muted">'+money(gross)+'</td>'+
      '<td><button class="btn sm ghost" data-act="fee-edit" data-v="'+p.id+'">'+icon('edit',14)+'</button></td></tr>';
  });
  return '<div class="rowb" style="margin-bottom:14px;gap:10px;flex-wrap:wrap">'+
      '<div><h1 style="font-size:20px">'+t('fee_plans')+'</h1>'+
      '<div class="tiny muted">'+t('fees_hint')+'</div></div>'+
      '<a class="btn" href="#/admin/finance">'+t('back')+'</a></div>'+
    adminTable([t('fee'),t('amount'),t('period'),t('invoices'),t('billed'),''], rows,
      '<button class="btn primary" data-act="fee-new">'+icon('plus',16)+t('add_fee')+'</button>',
      DB.feePlans.length+' '+t('fee_plans').toLowerCase());
}

function modalPayment(invoiceId){
  const inv=DB.invoices.find(i=>i.id===invoiceId);
  const st=byId(DB.students,inv.studentId), pl=planOf(inv.planId);
  const due=inv.amount-paidOn(inv.id);
  openModal({title:t('record_payment'), body:
    '<div class="row" style="gap:10px;margin-bottom:14px">'+avatar(st.fullName,38,st.id)+
      '<div style="flex:1;min-width:0"><div style="font-family:var(--ui);font-weight:700">'+esc(st.fullName)+'</div>'+
      '<div class="tiny muted">'+esc(pl?L(pl.name):'')+' · '+esc(periodLabel(inv.period))+'</div></div>'+
      '<div style="font-family:var(--ui);font-weight:800;font-size:19px">'+money(due)+'</div></div>'+
    '<div class="grid g2" style="gap:12px">'+
      '<div class="field" style="margin:0"><label class="fl">'+t('amount')+'</label>'+
        '<input type="number" id="pyAmount" value="'+due+'" min="1" step="1"></div>'+
      '<div class="field" style="margin:0"><label class="fl">'+t('date')+'</label>'+
        '<input type="date" id="pyDate" value="'+ymd(today())+'"></div>'+
    '</div>'+
    '<div class="field" style="margin-top:12px"><label class="fl">'+t('method')+'</label><select id="pyMethod">'+
      PAY_METHODS.map(m=>'<option value="'+m.key+'">'+esc(state.lang==='sq'?m.sq:m.en)+'</option>').join('')+'</select></div>'+
    '<div class="field" style="margin-bottom:0"><label class="fl">'+t('reference')+'</label>'+
      '<input type="text" id="pyRef" placeholder="'+t('reference_ph')+'"></div>'+
    '<div class="notice" style="margin-top:13px">'+icon('bell',16)+'<span>'+t('receipt_note')+'</span></div>',
    footer:'<button class="btn" data-act="close-modal">'+t('cancel')+'</button>'+
      '<button class="btn primary" data-act="pay-save" data-v="'+inv.id+'">'+t('save')+'</button>'});
}

function modalFee(planId){
  const p=planId? planOf(planId) : null;
  openModal({title: p? t('edit')+' · '+esc(L(p.name)) : t('add_fee'), body:
    '<div class="field"><label class="fl">'+t('name')+' (SQ)</label>'+
      '<input type="text" id="feSq" value="'+esc(p?p.name.sq:'')+'" placeholder="p.sh. Aktivitete jashtëshkollore"></div>'+
    '<div class="field"><label class="fl">'+t('name')+' (EN)</label>'+
      '<input type="text" id="feEn" value="'+esc(p?p.name.en:'')+'"></div>'+
    '<div class="grid g2" style="gap:12px">'+
      '<div class="field" style="margin:0"><label class="fl">'+t('amount')+' (€)</label>'+
        '<input type="number" id="feAmount" value="'+(p?p.amount:0)+'" min="0" step="5"></div>'+
      '<div class="field" style="margin:0"><label class="fl">'+t('period')+'</label><select id="fePeriod">'+
        '<option value="monthly"'+(p&&p.period==='monthly'?' selected':'')+'>'+t('monthly')+'</option>'+
        '<option value="yearly"'+(p&&p.period==='yearly'?' selected':'')+'>'+t('yearly')+'</option></select></div>'+
    '</div>'+
    (p? '<div class="notice" style="margin-top:13px">'+icon('info',16)+'<span>'+t('fee_change_note')+'</span></div>':''),
    footer:'<button class="btn" data-act="close-modal">'+t('cancel')+'</button>'+
      '<button class="btn primary" data-act="fee-save"'+(p?' data-v="'+p.id+'"':'')+'>'+t('save')+'</button>'});
}

function modalGenerate(){
  const periods=billingPeriods();
  const last=periods[0]||'2026-09';
  const [y,m]=last.split('-').map(Number);
  const nextM=m===12?1:m+1, nextY=m===12?y+1:y;
  const next=nextY+'-'+String(nextM).padStart(2,'0');
  const already=DB.invoices.some(i=>i.period===next);
  const n=DB.students.length;
  openModal({title:t('generate_month'), body:
    '<div class="field"><label class="fl">'+t('period')+'</label>'+
      '<input type="text" id="gnPeriod" value="'+next+'" placeholder="2026-10"></div>'+
    '<p class="small muted">'+esc(tf('generate_hint',{n:n}))+'</p>'+
    (already? '<div class="notice warn" style="margin-top:12px">'+icon('alert',16)+'<span>'+t('period_exists')+'</span></div>':'')+
    '<div class="notice" style="margin-top:12px">'+icon('info',16)+'<span>'+t('generate_note')+'</span></div>',
    footer:'<button class="btn" data-act="close-modal">'+t('cancel')+'</button>'+
      '<button class="btn primary" data-act="gen-save">'+t('generate')+'</button>'});
}

/* ---------- what a guardian sees ---------- */
function ParentPayments(){
  const st=activeChild(); if(!st) return notFoundView();
  const list=invoicesForStudent(st.id);
  const owed=balanceForStudent(st.id);
  const overdue=list.filter(i=>invoiceStatus(i)==='overdue');
  if(!list.length) return childHeroCard(st)+'<div class="card" style="margin-top:16px"><div class="card-b">'+
    emptyState('nothing_here','nothing_here_hint','chart')+'</div></div>';
  return childHeroCard(st)+
    '<div class="card" style="margin-top:16px'+(owed? ';border-color:'+(overdue.length?'var(--err-50)':'var(--warn-50)') : '')+'">'+
      '<div class="card-b"><div class="rowb" style="gap:12px;flex-wrap:wrap">'+
        '<div>'+metric(money(owed), t('balance_due'), owed? (overdue.length?'err':'warn') : 'ok')+
          '<div class="tiny muted" style="margin-top:5px">'+
            (owed? esc(tf('invoices_open',{n:list.filter(i=>invoiceStatus(i)!=='paid').length}))
                 : t('all_settled'))+'</div></div>'+
        '<div class="tiny faint" style="max-width:34ch;text-align:right">'+t('payments_office_note')+'</div>'+
      '</div></div></div>'+
    sectionHead(t('invoices'))+
    '<div class="card"><div class="card-b" style="padding-top:6px">'+
      list.map(inv=>{
        const s=invoiceStatus(inv), pl=planOf(inv.planId), paid=paidOn(inv.id);
        return '<div class="list-row" style="align-items:flex-start">'+
          '<span class="chip '+PAY_TONE[s]+'">'+t(s==='part'?'partly_paid':(s==='open'?'unpaid':s))+'</span>'+
          '<div style="flex:1;min-width:0">'+
            '<div style="font-family:var(--ui);font-weight:600;font-size:13.5px">'+esc(pl?L(pl.name):'—')+'</div>'+
            '<div class="tiny muted">'+esc(periodLabel(inv.period))+' · '+t('due')+' '+esc(fmtDate(inv.dueDate))+
              (inv.discount? ' · <span style="color:var(--ok)">−'+money(inv.discount)+'</span>':'')+'</div>'+
            (s==='part'? '<div class="tiny muted">'+t('paid')+' '+money(paid)+' '+t('of')+' '+money(inv.amount)+'</div>':'')+
            (s==='paid'? '<div class="tiny faint">'+esc(lastPaymentLabel(inv.id))+'</div>':'')+
          '</div>'+
          '<div style="font-family:var(--ui);font-weight:700;white-space:nowrap">'+money(inv.amount)+'</div>'+
        '</div>';
      }).join('')+
    '</div></div>';
}

   ========================================================================= */
Object.assign(VIEWS, {
  'admin/finance':AdminFinance, 'admin/fees':AdminFees, 'parent/payments':ParentPayments
});

Object.assign(ACTIONS, {
  'fin-filter':(d)=>{ state.ui.finFilter=d.v; render(); },
  'pay-open':(d)=>{
    if(state.session.role!=='admin'){ toast(t('no_access'),'lock'); return; }
    modalPayment(d.v);
  },
  'pay-save':(d)=>{
    if(state.session.role!=='admin'){ toast(t('no_access'),'lock'); return; }
    const inv=DB.invoices.find(i=>i.id===d.v); if(!inv) return;
    const v=id=>{ const e=document.getElementById(id); return e? e.value.trim():''; };
    const amount=Number(v('pyAmount'));
    if(!(amount>0)){ toast(t('amount_required'),'alert'); return; }
    DB.payments.push({id:uuid('pay'+Date.now()), schoolId:DB._ref.SCHOOL, invoiceId:inv.id,
      studentId:inv.studentId, amount, date:v('pyDate')||ymd(today()),
      method:v('pyMethod')||'cash', reference:v('pyRef')||null,
      recordedBy:state.session.userId, created_at:nowISO()});
    if(paidOn(inv.id)>=inv.amount) inv.status='paid';
    /* the receipt is the guardian's, so they are told it landed */
    DB.parentStudent.filter(r=>r.studentId===inv.studentId).forEach(r=>
      pushNotification('parent:'+r.parentId,'payment',
        'Pagesa u regjistrua — '+money(amount), 'Payment recorded — '+money(amount), '#/parent/payments'));
    audit('payment.record', inv.id+' '+amount);
    closeModal(); toast(t('payment_recorded'),'checkcircle'); render();
  },
  'fin-remind':(d)=>{
    if(state.session.role!=='admin'){ toast(t('no_access'),'lock'); return; }
    const late=DB.invoices.filter(i=>i.period===d.v && invoiceStatus(i)==='overdue');
    let n=0;
    late.forEach(inv=>DB.parentStudent.filter(r=>r.studentId===inv.studentId).forEach(r=>{
      pushNotification('parent:'+r.parentId,'payment',
        'Kujtesë për pagesën — '+periodLabel(inv.period),
        'Payment reminder — '+periodLabel(inv.period), '#/parent/payments'); n++;
    }));
    audit('payment.reminders', d.v+' n='+n);
    toast(n? tf('reminders_sent',{n:n}) : t('nothing_overdue'),'bell');
    render();
  },
  'fin-generate':()=>{
    if(state.session.role!=='admin'){ toast(t('no_access'),'lock'); return; }
    modalGenerate();
  },
  'gen-save':()=>{
    if(state.session.role!=='admin'){ toast(t('no_access'),'lock'); return; }
    const el=document.getElementById('gnPeriod');
    const period=el? el.value.trim() : '';
    if(!/^[0-9]{4}-[0-9]{2}$/.test(period)){ toast(t('period_format'),'alert'); return; }
    if(DB.invoices.some(i=>i.period===period)){ toast(t('period_exists'),'alert'); return; }
    /* repeat last month's lines for every child, so nothing is invented — and
       bill children who joined since, who have no history to repeat */
    const prev=billingPeriods()[0];
    let n=0;
    const add=(studentId, classId, planId, discount)=>{
      const pl=planOf(planId); if(!pl || pl.active===false) return;
      DB.invoices.push({id:uuid('inv'+Date.now()+'-'+n), schoolId:DB._ref.SCHOOL, studentId,
        classId, planId, period, dueDate:period+'-10',
        amount:pl.amount - (discount||0), discount:discount||0, currency:'EUR',
        issuedAt:nowISO(), status:'open'});
      n++;
    };
    DB.students.forEach(st=>{
      const lines=DB.invoices.filter(i=>i.period===prev && i.studentId===st.id);
      if(lines.length) lines.forEach(src=>add(st.id, st.classId, src.planId, src.discount));
      else { const pl=defaultPlanFor(st); if(pl) add(st.id, st.classId, pl.id, 0); }
    });
    audit('invoice.generate', period+' n='+n);
    closeModal(); toast(tf('invoices_generated',{n:n}),'checkcircle');
    go('admin/finance?p='+period); onRoute();
  },
  'fee-new':()=>modalFee(null),
  'fee-edit':(d)=>modalFee(d.v),
  'fee-save':(d)=>{
    if(state.session.role!=='admin'){ toast(t('no_access'),'lock'); return; }
    const v=id=>{ const e=document.getElementById(id); return e? e.value.trim():''; };
    const sq=v('feSq'), en=v('feEn')||sq, amount=Number(v('feAmount')), period=v('fePeriod')||'monthly';
    if(!sq || !(amount>=0)){ toast(t('row_error_fields'),'alert'); return; }
    if(d.v){
      const p=planOf(d.v); p.name={sq,en}; p.amount=amount; p.period=period;
      audit('fee.edit', sq);
    } else {
      DB.feePlans.push({id:uuid('plan'+Date.now()), schoolId:DB._ref.SCHOOL,
        key:sq.toLowerCase().replace(/\s+/g,'_').slice(0,16), name:{sq,en},
        amount, currency:'EUR', period, gradeLevelKey:null, active:true});
      audit('fee.create', sq);
    }
    closeModal(); toast(t('saved'),'checkcircle'); render();
  }
});


/* =========================================================================
   RUAJTJA — keeping the data between reloads
   There is still no server here, so this saves into the browser's own storage.
   That means the data survives a reload on this device and in this browser,
   and nowhere else: what a teacher enters on a tablet does not appear on a
   parent's phone. For that you need the backend in supabase/.
   ========================================================================= */

const STORE_KEY = 'hello-academy:' + APP_VARIANT + ':v1';
let storeOK = true;          /* flips false once the browser refuses to save */
let storeWarned = false;

function storageAvailable(){
  try{
    const k='__probe__';
    window.localStorage.setItem(k,'1');
    window.localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}
const HAS_STORE = storageAvailable();

/* Video object URLs die with the page, so there is no point storing them.
   Image data URLs are kept until the browser complains, then dropped too —
   the record stays, only the picture goes, which degrades honestly. */
function serialise(dropMedia){
  const db=JSON.parse(JSON.stringify(DB));
  (db.photos||[]).forEach(p=>{
    if(p.mediaType==='video' || (dropMedia && p.src)) { p.src=null; p.mediaLost=true; }
  });
  if(dropMedia){
    (db.students||[]).forEach(s=>{ if(s.photoUrl) s.photoUrl=null; });
    (db.parents||[]).forEach(s=>{ if(s.photoUrl) s.photoUrl=null; });
    (db.teachers||[]).forEach(s=>{ if(s.photoUrl) s.photoUrl=null; });
  }
  return JSON.stringify({
    v:1, savedAt:new Date().toISOString(), db,
    session:state.session, childId:state.childId, lang:state.lang
  });
}

function saveNow(){
  if(!HAS_STORE || !storeOK) return;
  try{
    window.localStorage.setItem(STORE_KEY, serialise(false));
  }catch(e){
    /* almost always the quota: try again without the pictures */
    try{
      window.localStorage.setItem(STORE_KEY, serialise(true));
      if(!storeWarned){ storeWarned=true; toast(t('store_media_dropped'),'alert'); }
    }catch(e2){
      storeOK=false;
      if(!storeWarned){ storeWarned=true; toast(t('store_failed'),'alert'); }
    }
  }
}

let saveTimer=null;
function scheduleSave(){
  if(!HAS_STORE || !storeOK) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveNow, 400);
}

function restore(){
  if(!HAS_STORE) return false;
  let raw;
  try{ raw=window.localStorage.getItem(STORE_KEY); }catch(e){ return false; }
  if(!raw) return false;
  try{
    const parsed=JSON.parse(raw);
    if(!parsed || parsed.v!==1 || !parsed.db || !parsed.db.students) return false;
    DB=parsed.db;
    /* a session from the other portal must not be honoured here */
    const s=parsed.session;
    const fits = !s || (APP_VARIANT==='parent' ? s.role==='parent' : s.role!=='parent');
    state.session = fits ? s : null;
    state.childId = fits ? (parsed.childId||null) : null;
    if(parsed.lang) state.lang=parsed.lang;
    rebuildAvatars();
    return true;
  }catch(e){ return false; }
}

function rebuildAvatars(){
  Object.keys(AVATARS).forEach(k=>{ delete AVATARS[k]; });
  [].concat(DB.students||[], DB.parents||[], DB.teachers||[]).forEach(p=>{
    if(p && p.photoUrl) AVATARS[p.id]=p.photoUrl;
  });
}

function clearStore(){
  try{ window.localStorage.removeItem(STORE_KEY); }catch(e){}
  storeOK=true; storeWarned=false;
}

function lastSavedAt(){
  if(!HAS_STORE) return null;
  try{
    const raw=window.localStorage.getItem(STORE_KEY);
    return raw? JSON.parse(raw).savedAt : null;
  }catch(e){ return null; }
}

/* the card shown in settings, so nobody has to guess where the data lives */
function storageCard(){
  const saved=lastSavedAt();
  const state_ = !HAS_STORE ? 'off' : (!storeOK ? 'failed' : (saved ? 'on' : 'empty'));
  const tone={on:'ok', empty:'', failed:'err', off:'warn'}[state_];
  return '<div class="card"><div class="card-h"><h3>'+t('data_storage')+'</h3>'+
      '<span class="chip '+tone+'">'+t('store_'+state_)+'</span></div>'+
    '<div class="card-b">'+
      '<p class="small muted">'+t('store_explain')+'</p>'+
      (saved? '<div class="tiny faint" style="margin-top:8px">'+t('last_saved')+' '+esc(relTime(saved))+'</div>' : '')+
      '<div class="notice" style="margin:14px 0 0">'+icon('info',16)+'<span>'+t('store_limit')+'</span></div>'+
      '<div class="row" style="gap:8px;margin-top:14px">'+
        '<button class="btn" data-act="store-export">'+icon('download',15)+t('export_data')+'</button>'+
        '<button class="btn ghost" data-act="store-clear">'+icon('trash',15)+t('clear_data')+'</button>'+
      '</div>'+
    '</div></div>';
}

Object.assign(ACTIONS, {
  'store-clear':()=>{
    clearStore();
    DB=seed(); state.ui={}; state.childId=null;
    rebuildAvatars();
    toast(t('demo_reset'),'sparkle');
    render();
  },
  'store-export':()=>{
    const blob=new Blob([serialise(false)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='hello-academy-'+APP_VARIANT+'-'+ymd(today())+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    audit('data.export','local');
  }
});

/* the existing reset should forget the saved copy too, not just the memory */
ACTIONS['reset-demo']=()=>{
  clearStore();
  DB=seed(); state.ui={}; state.childId=null;
  rebuildAvatars();
  toast(t('demo_reset'),'sparkle');
  render();
};

/* every render follows a change, so this is the one place worth hooking */
const renderWithoutSave = render;
render = function(){ renderWithoutSave.apply(null, arguments); scheduleSave(); };
/* and once more on the way out, in case a change never triggered a render */
window.addEventListener('pagehide', saveNow);
window.addEventListener('beforeunload', saveNow);

restore();
window.addEventListener('hashchange', onRoute);
onRoute();
</script>
